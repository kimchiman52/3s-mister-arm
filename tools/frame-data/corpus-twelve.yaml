# N.D.L. S/R-DIVERGENCE — RESOLVED 2026-07-09 (§13.12, ENGINE-4, design
# E4-A′, lever J). Was: all three strengths (WHIFF included) measured S
# undershooting arcade by a uniform 3 (Jab/Strong S=12 vs arcade 15, Fierce
# S=13 vs arcade 16) and R overshooting by 12-14 (Jab R=26/Strong R=30/
# Fierce R=34 vs arcade 14/16/20), while `proj_a` (11/13/13) and BLOCK
# advantage (-5/-9/-13, matching twelve.json's own Badv exactly) both
# already confirmed correct move identity and correct wall-clock timing —
# the fault was isolated to the ENGINE'S OWN S/R decomposition of that
# timing, not a misidentification.
#
# Root cause (traced 2026-07-09): the shipped `use_proj_split` anchors (S =
# proj_spawn_slot, R = meter_len - proj_spawn_slot) were validated only
# against Hadouken-style fire-and-forget fireballs, whose hit-check arms
# (`att_hit_ok`) the SAME tick they spawn. N.D.L. (kind_of_tama=13,
# kotp_13000) arms two chart cells AFTER its own spawn — a genuine
# "hit-checkable projectile split" the old anchors couldn't see — and its
# consumption handler never cuts the chart to an erase chart (unlike every
# fireball ending, which always does), so its recovery window is a
# chart-natural end, not a fire-and-forget budget.
#
# Fix: S' = max(proj_spawn_slot, proj_athok_slot) — anchored on the tama's
# own hit-check-gated arming tick (fd_engine_proj_hitok, hitcheck.c's own
# atix!=0 && att_hit_ok!=0 gate) whenever it lands later than spawn. R', on
# a chart-natural end (fd_engine_proj_natend, gated on the engine's own
# chart-cut kill-reason latch fd_engine_proj_cut never having fired), is
# instead meter_len - (proj_firstact_slot + proj_a) — the declared
# active-window form. Both anchors reproduce all 9 arcade values exactly
# (S=15/15/16, R=14/16/20 for Jab/Strong/Fierce) and are measured
# byte-identical on all 45 other proj=1 rows across 7 fireball characters
# (every fireball ending is a cut, so the new anchors are a no-op for
# them). See docs/frame-data-synthesis.md §13.12 for the full mechanism,
# the chart-cut discriminator, and the R-gate falsification ledger.
# S/R/verdict below now read plain PASS (xfail keys removed) in every
# entry; A and adv were already exact throughout and are unaffected.
#
