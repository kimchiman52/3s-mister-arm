# so no expect.adv (same "not checked" posture as every other UOH entry
# here regardless of the field's exact non-numeric shape).
#
# NEW FINDING, UNCLASSIFIED (flagged 2026-07-08): unlike every other
# character's UOH row in this repo (a single declared-truth A value
# uniform across all three outcomes, per §13.11 - e.g. Ibuki A=11 on all
# three, Oro A=10 exact on all three), Alex's measured A VARIES BY OUTCOME:
# WHIFF/HIT both read A=12, BLOCK reads A=15 - three distinct S/A/R
# signatures, not a single uniform declared-truth value. Lever-F-tested
# (fd_restore_revoked_declared_credit forced 0 on a scratch build,
# reverted before commit, same batch as the normals-section census): A is
# UNCHANGED in ALL THREE outcomes (12/15/12 both with the lever on and
# off) - this rules OUT a lever-F regression; the mechanism is unrelated to
# the §13.7.4 revoke/restore machinery entirely.
#
# Trace facts (raw observations only, no mechanism claimed): WHIFF T=29
# (S+A+R=30, 1-tick gap), cut=1, anchor_a=12 matches engine_a=12,
# active_pf=11 (1 LESS than engine_a=12); BLOCK T=33 (S+A+R=32, 1-tick
# gap), cut=1, anchor_a=15 matches engine_a=15, active_pf=16 (1 MORE than
# engine_a=15 - the OPPOSITE-direction gap from WHIFF's); HIT T=29
# (S+A+R=29 exact), cut=1, anchor_a=12 matches engine_a=12, active_pf=12
# (EXACTLY equal to engine_a, unlike either WHIFF or BLOCK). All three
# read R below arcade's 5 (WHIFF R=3, BLOCK/HIT both R=2). S is exact on
# all three (S=15).
#
# This is a genuinely novel three-way A-variance shape, distinct from
# every existing UOH precedent in this repo (which show a SINGLE uniform
# A value, only R varying by outcome) - does not fit the §13.11
# declared-truth convention (that requires ONE value, not three), and the
# active_pf-vs-engine_a relationship itself flips sign across the three
# outcomes (no candidate mechanism offered). UNCLASSIFIED, flagged to
