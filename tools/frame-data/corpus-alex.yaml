# alex.json's Universal Overhead: S=15/A=10/R=5 - the SAME numbers as
# q/dudley/chunli/akuma/oro/yang/ibuki.json's own UOH row (shared move data
# across the cast). Block_advantage/Hit_advantage/Crouch_hit_advantage are
