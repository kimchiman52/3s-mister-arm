# md5 763929513f271e2bf05c7177d12346d8). CHARACTER_IDS key is "elena"
# (compile_corpus.py:45, id=8).
#
# FAR-NORMAL COVERAGE (a fifth distinct far-normal-gap shape in this repo,
# distinct from Alex/Yun/Oro/Yang/Ibuki's own gaps): elena.json has ZERO
# "Far"-prefixed rows at all - verified by reading every Name string in the
# fetched oracle (48 rows total). ALL SIX standing normals' WHIFF entries
# below cite their own single row, same convention as corpus-alex.yaml's
# Strong/Fierce/Short/Roundhouse precedent, extended here to every button.
#
# COMMON_NAME GAP (blocks the task's own verification method): every one of
# elena.json's 48 rows has Common_name="" (empty string) - verified
# programmatically across every row. This is a genuinely distinct gap from
# every other character fetched so far in this repo (which all publish real
# Common_name strings, e.g. corpus-alex.yaml's "cr.HP, 2HP"). The task asked
# to "verify vs oracle Common_name" for Lynx Tail's motion (forward-DP vs
# reverse-DP) - impossible here since there is no Common_name data at all for
# this character. The motion-probe method (S-value matching against the
# oracle's Startup field per CORPUS-AUTHORING.md Phase 5) was used instead,
# same discipline as the Ibuki Kubiori precedent (which also had to fall back
# past a wrong tentative guess).
#
# KD BIG-NUMBER CONVENTION (no literal "D" rows at all): unlike most
# characters in this repo, elena.json has ZERO Hit_advantage="D" rows -
# verified across every row. Three rows instead use the akuma.json/ryu.json
# large-positive-number-on-knockdown convention (documented at
# corpus-ryu.yaml's ryu-throw-hit / corpus-akuma.yaml's
# akuma-crroundhouse-hit): Crouching Roundhouse (Hit_advantage=34),
# Down-Towards + Roundhouse (Hit_advantage=29), Throw (Hit_advantage=70).
# UNLIKE ryu.json's Throw=45 (which does NOT match its own observed +82,
# left unasserted), Crouching Roundhouse's 34 and Down-Towards + Roundhouse's
# 29 BOTH match their own measured adv EXACTLY (same posture as
# corpus-akuma.yaml's akuma-crroundhouse-hit, the first sweep in that repo
# where the oracle's big number was directly comparable) - both asserted
# via expect.adv: from-qjson below. Throw's 70 does NOT match its own
# measured +91 - left unasserted, same posture as ryu-throw-hit/
# akuma-throw-hit.
#
# COMMAND-NORMAL COUNT: FOUR Towards/Back/Down-Towards-prefixed rows -
# Towards + Strong, Down-Towards + Roundhouse, Towards + Forward, Back +
# Roundhouse - verified against every Name string in the fetched oracle.
# Down-Towards + Roundhouse is the KD row (see above) and is Parry Low=True/
# High=False (a genuine low sweep, not an overhead) - gets BLOCK+WHIFF+HIT.
# The other three are non-KD, Parry High=True - BLOCK+WHIFF only, per the
# Dudley/Makoto/Urien/Akuma/Oro/Alex non-D-row precedent.
#
# ISSUE #17 FAMILY CENSUS (per CORPUS-AUTHORING.md Phase 6 item 1's
# discriminator): every A-undercount below (elena-jab-block/-hit,
# elena-short-block/-hit, elena-twdsstrong-block, elena-lynxtail-lk-block/
# -hit) was lever-F-tested in ONE batched scratch build
# (fd_restore_revoked_declared_credit forced to 0 at
# src/sf33rd/Source/Game/engine/charset.c:507, whole probe corpus re-run
# once, reverted via `git checkout` + rebuild + re-verified green before
# this commit, same-binary protocol throughout). RESULT: every one of these
# entries' measured A was UNCHANGED by the lever-F toggle (byte-identical
# with the restore on and off) - no revoke fires for any of them, ruling out
# a lever-F regression across the board; all are shape (a), unrecoverable
# per §13.11. The UOH entries (elena-uoh-whiff/-block/-hit) were included in
# the same lever-F batch and were ALSO unchanged - their divergences are
# unrelated to the §13.7.4 revoke/restore machinery entirely (see UOH
# section comment).
#
# MOTION VERIFICATION (task flagged several motions as tentative guesses -
# verify-vs-oracle discipline applied via the S-value motion-probe method,
# CORPUS-AUTHORING.md Phase 5, since Common_name is unavailable - see GAP
# above): Rhino Horn CONFIRMED hcf+K (task's guess correct, S=14 exact
# match, unambiguous vs Forward/RH's own S=18/23). Mallet Smash CONFIRMED
# hcb+P - task's tentative "hcf+P" guess was WRONG (hcf+LP instead lands
# the plain Jab normal, S=5/A=4/R=10, not the special); hcb+LP lands S=21/
# A=8/R=13, an EXACT match to Mallet Smash Jab's oracle row (same
# wrong-tentative-guess shape as the Ibuki Kubiori precedent, hcf-guessed,
# hcb-confirmed). Scratch Wheel CONFIRMED DP-shape hold-chain + K (task's
# guess correct, S=6 exact match, unambiguous vs Forward/RH's S=4/3).
# Spinning Scythe CONFIRMED qcb+K (task's guess correct, S=15 exact match,
# unambiguous vs Forward/RH's S=16/17); NO separate follow-up-named rows
# exist for this move (task flagged "oracle may have follow-up rows" as a
# caution - checked, elena.json has only the standard Short/Forward/RH/EX
# per-strength rows for Spinning Scythe, same shape as every other special
# in this oracle, no distinct follow-up move name). Lynx Tail CONFIRMED
# reverse-DP-shape hold-chain (back, down, down-back, back+K) + K - task's
# own "dp reverse?" tentative guess was correct (S=11/A=6/R=35 all THREE
# match the oracle's Short row EXACTLY on WHIFF, an unambiguous, fully clean
# identification); the forward-DP-shape hold-chain and hcb+K were also
# probed and both produced OTHER moves instead (plain Short normal and
# Spinning Scythe respectively) - ruling those out.
#
# ORDERING NOTE - TWO DISTINCT §12.1 contamination shapes found and fixed
# in this corpus (both caught by re-running the compiled corpus and
# checking each entry's MOVE_START `dist` against its requested
# setup.dist, not just by trusting a clean-looking checker verdict):
#   1. §12.1 row 2 (momentum bleed after a connecting dash special): an
#      early probe placed Rhino Horn's HIT entry immediately before Mallet
#      Smash's WHIFF entry and the WHIFF entry read as a spurious HIT
#      (P1's post-dash position hadn't settled). Fix: Rhino Horn (Elena's
#      only always-connects-at-any-distance special) is ordered LAST among
#      the ground specials.
#   2. §12.1 row 1 (P-teleport no-op after a connecting command-grab,
#      Hugo h-meatsquasher-short-whiff precedent): a later full-corpus run
#      placed Throw's HIT entry immediately before Mallet Smash's WHIFF
#      entry (right after UOH) and the SAME spurious-HIT symptom
#      reappeared (MOVE_START dist=73 instead of the requested 250) - this
#      time from Throw's own post-grab residue, not Rhino Horn's dash
#      (confirmed by isolated single-entry re-verification of Mallet Smash
#      alone, which reproduced the fully clean numbers). Down-Towards +
#      Roundhouse's own HIT earlier in the corpus is ALSO a knockdown but
#      did NOT corrupt the following UOH WHIFF entry (confirmed MOVE_START
#      dist=250 exactly) - the residue is command-grab-specific, not
#      generic post-knockdown residue. Fix: Throw is ordered immediately
#      before Rhino Horn (both LAST), since Rhino Horn is immune to
#      distance corruption (see its own section comment).
# Isolated single-entry re-verification (Phase 5 discipline) of every
# ground-special family confirmed the batch-probe numbers were otherwise
# trustworthy. Final section order: Mallet Smash, Scratch Wheel, Spinning
# Scythe, Lynx Tail, Throw, Rhino Horn - every WHIFF-sensitive family
# before both always-connecting/residue-leaving moves, per the §12.1
# workaround ("order distance-sensitive WHIFF entries before always-
# connecting HIT entries in the same section").
