# Remy under ARCADE (CPS3) balance -- task #136, generalisation probe.
#
# WHY THIS CORPUS EXISTS
# ----------------------
# Task #108 shipped arcade coverage for exactly two corpora (Q and Yun SA3) and
# was explicit that "the other 18 characters port cheaply" was an ARGUMENT, not
# a measurement. This corpus is one of three bounded tests of that
# generalisation (task #136), alongside corpus-hugo-arcade.yaml (heaviest body,
# command-grab machinery) and corpus-twelve-arcade.yaml.
#
# IT IS A SLICE, NOT A PORT
# -------------------------
# 16 of corpus-remy.yaml's 56 entries, chosen to span the mechanics that
# distinguish Remy: a charge character with a projectile (Light of Virtue), a charge-up
#   reversal (Rising Rage Flash), a command normal, UOH, a throw and a
#   jump negative control -- none of which Q or Yun exercise. It is NOT full arcade coverage for Remy and does not
# claim to be; the 40 entries not listed here are still PS2-only.
#
# PROVENANCE
# ----------
# Every `setup`/`input`/`qjson`/`outcome`/`expect` below is reproduced
# unchanged from corpus-remy.yaml's entry of the same label. The per-entry
# authoring comments are NOT duplicated -- read them at that label in
# corpus-remy.yaml, which stays the single source of the rationale.
#
# RESULT
# ------
# 16/16 PASS under --test-balance arcade, and the parsed table is
# byte-identical to running THIS SAME FILE under --test-balance ps2 -- the
# control that isolates engine from corpus composition, since a slice run on
# its own does not reproduce the full corpus's carried state. Measured
# 2026-08-30.
#
# ONE ARCADE DEVIATION (task #136), not touching any `expect:`
# ------------------------------------------------------------
# `remy-crroundhouse-block` says `dummy: crouch` where corpus-remy.yaml says
# `dummy: stand`. cr.HK is a LOW, and defense_ground_cps3() requires the crouch
# bit to be held to guard a low (`case 8: if (!(ds->cp->sw_lvbt & 2)) return
# 2;`, hitcheck.c:1320-1321); defense_ground_ps2()'s same case has an
# `&& ags == 0` escape (hitcheck.c:1508) that lets a STANDING training
# ALL-GUARD dummy block a low, which is why the PS2 twin never had to say
# `crouch`. Measured verbatim-with-`stand` under arcade: HIT adv=+12 kd=1
# instead of BLOCK adv=-11. That single rule is the ONLY arcade-vs-port
# divergence this slice found.
character: remy
oracle: remy.json
balance: arcade
inter_entry_wait: 150
entries:

- label: remy-jab-block
  setup: {"dist": "close", "dummy": "stand"}
  input: "press LP"
  qjson: {"name": "Jab"}
  outcome: BLOCK
  expect: {"S": "from-qjson", "A": "from-qjson", "R": "from-qjson", "adv": "from-qjson"}

- label: remy-crfierce-block
  setup: {"dist": "close", "dummy": "stand"}
  input: "press DOWN+HP"
  qjson: {"name": "Crouching Fierce"}
  outcome: BLOCK
  expect: {"S": "from-qjson", "A": "from-qjson", "R": "from-qjson", "adv": "from-qjson"}

- label: remy-crroundhouse-block
  setup: {"dist": "close", "dummy": "crouch"}
  input: "press DOWN+HK"
  qjson: {"name": "Crouching Roundhouse"}
  outcome: BLOCK
  expect: {"S": "from-qjson", "A": "from-qjson", "R": "from-qjson", "adv": "from-qjson"}

- label: remy-jab-hit
  setup: {"dist": "close", "dummy": "none"}
  input: "press LP"
  qjson: {"name": "Jab"}
  outcome: HIT
  expect: {"S": "from-qjson", "A": "from-qjson", "R": "from-qjson", "adv": "from-qjson"}

- label: remy-fierce-hit
  setup: {"dist": "close", "dummy": "none"}
  input: "press HP"
  qjson: {"name": "Fierce"}
  outcome: HIT
  expect: {"S": "from-qjson", "A": "from-qjson", "R": "from-qjson", "adv": "from-qjson"}

- label: remy-crfierce-hit
  setup: {"dist": "close", "dummy": "none"}
  input: "press DOWN+HP; wait 60"
  qjson: {"name": "Crouching Fierce"}
  outcome: HIT
  expect: {"S": "from-qjson", "A": "from-qjson", "R": "from-qjson", "kd": 1}

- label: remy-lp-whiff
  setup: {"dist": 250, "dummy": "none"}
  input: "press LP"
  qjson: {"name": "Far Jab"}
  outcome: WHIFF
  expect: {"S": "from-qjson", "A": "from-qjson", "R": "from-qjson"}

- label: remy-hk-whiff
  setup: {"dist": 250, "dummy": "none"}
  input: "press HK"
  qjson: {"name": "Far Roundhouse"}
  outcome: WHIFF
  expect: {"S": "from-qjson", "A": "from-qjson", "R": "from-qjson"}

- label: remy-uoh-block
  setup: {"dist": "close", "dummy": "stand"}
  input: "press MP+MK"
  qjson: {"name": "Universal Overhead"}
  outcome: BLOCK
  expect: {"S": "from-qjson", "A": 13, "R": 4}

- label: remy-uoh-hit
  setup: {"dist": "close", "dummy": "none"}
  input: "press MP+MK"
  qjson: {"name": "Universal Overhead"}
  outcome: HIT
  expect: {"S": "from-qjson", "A": 11, "R": 4}

- label: remy-throw-hit
  setup: {"dist": 9, "dummy": "none"}
  input: "press LP+LK; wait 90"
  qjson: {"name": "Throw"}
  outcome: HIT
  expect: {"S": "from-qjson", "A": "from-qjson", "R": 22, "kd": 1}

- label: remy-lov-lp-whiff
  setup: {"dist": 250, "dummy": "none"}
  input: "motion charge-back 60 then-forward LP"
  qjson: {"name": "Light of Virtue (Jab)"}
  outcome: WHIFF
  expect: {"S": "from-qjson", "R": "from-qjson"}

- label: remy-lov-lp-block
  setup: {"dist": "close", "dummy": "stand"}
  input: "motion charge-back 60 then-forward LP"
  qjson: {"name": "Light of Virtue (Jab)"}
  outcome: BLOCK
  expect: {"S": "from-qjson", "R": "from-qjson", "adv": 23}

- label: remy-lov-lp-hit
  setup: {"dist": "close", "dummy": "none"}
  input: "motion charge-back 60 then-forward LP"
  qjson: {"name": "Light of Virtue (Jab)"}
  outcome: HIT
  expect: {"S": "from-qjson", "R": "from-qjson"}

- label: remy-rrf-lk-hit
  setup: {"dist": "close", "dummy": "none"}
  input: "motion charge-down 60 then-up LK"
  qjson: {"name": "Rising Rage Flash (Short)"}
  outcome: HIT
  expect: {"S": "from-qjson", "A": 4, "R": "from-qjson"}

- label: remy-jump-none
  setup: {"dist": 250, "dummy": "none"}
  input: "press UP"
  outcome: NONE
