# Hugo frame-data corpus (Phase 6 Step 6, docs/plan-frame-data-harness.md
# Phase 6 charter + /tmp/phase6-nonq-plan.md Step 6). Generated/consumed by
# tools/frame-data/compile_corpus.py against docs/arcade-frame-data/hugo.json
# (fetched Step 3, md5 8bd525542b815dd0c228605bffc51523).
#
# Scope: a normals baseline (BLOCK/HIT/WHIFF sample + crouching + a command
# normal + negative control) PLUS Hugo's three command-grab families
# (Shootdown Backbreaker, Moonsault Press, Meat Squasher) - the strongest
# regression exercise the CnDB machinery (finalize's §13.6/13.6.1/13.6.2
# levers) gets outside Q. Authored empirically against a live headless run,
# same discipline as corpus-ryu.yaml - every expect below was pinned by
# reading the actual trace, not guessed from hugo.json alone.
#
# Known harness limitations hit in this file (P-teleport no-op during
# knockdown tails; SDB HIT/BLOCK unreachable): see the consolidated
# "Harness limitations register", docs/frame-data-synthesis.md §12.1.
#
# --- Step 6a discovery: motion decoding (2026-07-07) ------------------------
#
# cmd_data.c's p6_cmd_28..33 bytecode was NOT hand-decoded (the check_0..26
# FSM in cmd_main.c interleaves per-node type/lever/window fields at
# variable offsets - the same "non-obvious lever-bit encoding" the
# docs/frame-data-synthesis.md §13.6 CnDB reinvestigation already flagged;
# static decoding two more slots for Hugo was not a productive use of this
# step given the plan's own discovery method is empirical S-value matching
# against the oracle, same as that reinvestigation did for Q's kow=24/26/28).
# Instead, per this plan's Step 6 instruction ("probe each grab via a
# throwaway corpus"), every candidate motion below was verified live and
# matched against hugo.json's Startup (and, where numeric, Hit/Recovery)
# columns - S is the ground truth signal, exactly as the repo's established
# methodology uses it (see docs/frame-data-synthesis.md §13.6 item 5's own
# "human-readable names... rest on the S-frame match against q.json, not a
# static source enumeration").
#
# The compiler's existing `motion hcb <BTN>` macro (the motion
# docs/frame-data-synthesis.md:1174 associates with "Hugo's HCB+K
# p6_cmd_33") was tried FIRST, per the plan. Result: inconsistent/no-signal
# for Hugo - `motion hcb LK`/`hcb HK` produced NO MOVE_START at all (r1
# never left 0) and `hcb MK` produced an unidentifiable r1=4 move (S=7,
# matching nothing in hugo.json) - unlike Q's CnDB, where the identical
# macro cleanly reproduces S=12/13/14. Conclusion: the byte-pattern
# similarity the synthesis doc's §13.6 item 1 draws between p12_cmd_31 and
# p6_cmd_33 (both showing the "5,4,5,6,23" sub-sequence, also present
# verbatim in Ryu's DP-motion p1_cmd_33) is evidence the table SHAPE
# (header + r1-window + short lever list + terminator) recurs across
# characters, not evidence the three slots share one literal motion - Hugo's
# actual command-grab motions are NOT HCB.
#
# What DOES land Hugo's grabs, verified live via `hold`/`wait` primitive
# chains (already-expressible input, no compiler change - see the 360
# verdict below):
#   - Shootdown Backbreaker (Short/Forward/RH): forward, down, down-forward
#     + LK/MK/HK (`hold RIGHT N; hold DOWN N; hold DOWN+RIGHT N; hold
#     RIGHT+<K> N`) - a DP-shaped input, per the real-arcade documented
#     command for this move (EventHubs/SuperCombo Wiki: "f,d,df+K"). Lands
#     an r1=4, cgix=12, kow=24 move whose S/A/R (5/9/30, 17/10/25, 12/12/29
#     for Short/Forward/RH) match hugo.json EXACTLY for all three strengths,
#     all three fields, zero divergence (see the grab section below - the
#     cleanest three-for-three arcade match found this session).
#   - Moonsault Press (Jab/Strong/Fierce) and Meat Squasher (Short/Forward/
#     RH): a 360-degree rotation + P/K respectively. Tested BOTH a full
#     8-way rotation (`hold RIGHT 2; hold DOWN+RIGHT 2; hold DOWN 2; hold
#     DOWN+LEFT 2; hold LEFT 2; hold UP+LEFT 2; hold UP 2; hold UP+RIGHT 2;
#     hold RIGHT+<btn> 2`) and a cardinal-only 4-way rotation (`hold RIGHT
#     2; hold DOWN 2; hold LEFT 2; hold UP 2; hold RIGHT+<btn> 2`) in
#     isolation (single-entry corpora, to rule out label bleed from a
#     stuck prior move - see below) - BOTH land the IDENTICAL move
#     (byte-identical S/A/R/r1/r2/cgix/kow), confirming 3S's documented
#     input leniency (partial-circle acceptance) applies here: a full
#     360 is not required, cardinal-4 suffices. LP/MP/HP all land Moonsault
#     Press (S=2 A=2, matching hugo.json's identical Startup/Hit=2/2 for
#     all three strengths exactly); LK/MK/HK all land Meat Squasher
#     (S=21/31/44 close-range, matching the FLOOR of hugo.json's range
#     strings "21~24"/"31~52"/"44~67" exactly - see the Meat Squasher
#     section below for the range-vs-distance finding).
#
# CAUTION discovered while probing (methodology note, not a corpus bug):
# a 360-shape move that doesn't finalize within its own SCRIPT window (the
# 8-way rotation's first attempt ran into this) leaves g_cur.active latched
# TRUE, which blocks the next entry's MOVE_START - the eventual FINAL then
# gets annotated under whatever SCRIPT label happens to be current when it
# fires, silently misattributing the result. Every number in this file's
# comments and expects was re-verified in an ISOLATED single-entry corpus
# (large inter_entry_wait, nothing after it) before being trusted - the
# multi-entry probe corpus alone would have produced a false attribution
# for at least two of these entries.
#
# 360 MACRO VERDICT: not added. Per this plan's own Step 6 criterion ("...
# extend _motion_steps ONLY IF the probe shows hcb/hcf sequences don't
# trigger a required grab" AND no other expressible sequence lands it) -
# hcb/hcf indeed fail, but a `hold`-chain (an EXISTING primitive, already
# in compile_corpus.py, no new code) lands both 360 families exactly, so
# the "no expressible sequence" condition is false. compile_corpus.py is
# UNCHANGED by this step - the cardinal-4 `hold` chain above is used
# directly in the entries below instead of a new macro.
#
# GRAB PRESENTATION CLASSES (r1=4 metered vs r1=2/3 is_throw, per the
# frame_data_overlay.c:830-834 MOVE_START classifier): every Hugo grab
# tested this session - Shootdown Backbreaker (all 3), Moonsault Press
# (all 3), Meat Squasher (all 3), AND the plain Throw (LP+LK, verified as
# a sanity check: r1=4, S=2 A=1 R=68, same shape as q-throw-hit/
# ryu-throw-hit) - opens at attacker r1=4 (CnDB-like, metered, real FINAL
# emitted). NONE opened at r1=2/3 (is_throw, no FINAL, `fd_finalize()`
# early-returns before the numeric annotate). The plan's anticipated
# "is_throw-opening grab, scope out of corpus" case (§Step 6 item 4) is
# therefore a KNOWN GAP THAT DID NOT MATERIALIZE for Hugo's grab family as
# tested here - not because the is_throw path was worked around, but
# because empirically no tested Hugo grab takes it. (Untested Hugo throws -
# Ultra Throw, Gigas Breaker - were not probed: Gigas is on the plan's
# Do-Not list; Ultra Throw simply isn't in Step 6's discovery list (SDB /
# Moonsault / Meat Squasher only). So this is not a claim that NO Hugo move
# is ever is_throw-opening, only that none of the nine grab entries below
# are.)
#
# STOP-rule accounting (plan Step 6: >50% of grab entries failing = stop):
# at authoring time, 6 of 11 grab entries (55%) were xfail - ALL six were
# the grab-HIT rows of the then-undiagnosed HIT-R divergence family
# (synthesis open issue 15; q-throw-hit / ryu-throw-hit precedent), with
# S/A/kd exact on every one. The rule's stated concern (grab presentation
# - is_throw vs metered) did not materialize: every tested grab is
# metered r1=4 with a real FINAL. Accepted explicitly by the orchestrator
# 2026-07-07 as cited-xfail coverage, not xfail-spam.
#
# UPDATE (Step 5, 2026-07-07): issue #15 is now RESOLVED
# (docs/frame-data-synthesis.md §13.10, oracle-convention adopted, no
# overlay change) - all 6 of these grab-HIT entries flip to plain PASS
# asserting the measured convention value; 0 of 11 grab entries are xfail
# after this step.
character: hugo
oracle: hugo.json
inter_entry_wait: 200
