# --- Shootdown Backbreaker (command grab, DP-shape input) -------------------
# Motion: forward, down, down-forward + LK/MK/HK (see file header). This is
# the CLEANEST arcade match found this session: S, A, AND R all match
# hugo.json exactly for all three strengths, zero divergence.
#
# Outcome is WHIFF against ANY grounded dummy configuration - verified at
# dist 20/55/250 and BOTH dummy:stand and dummy:none, always the identical
# S/A/R. This move never connects on the ground. hugo.json lists
# Block_advantage="-" AND Hit_advantage="-" for all three SDB rows (unlike
# every other move in this file, which has at least one numeric advantage
# field) - the plan's own Step 6 Do-Not list independently names "airborne-
# grab (SDB vs airborne dummy - dummy can't jump)" as an explicit scope cut,
# which is exactly consistent with what this session measured: Shootdown
# Backbreaker is Hugo's anti-air command grab (real-arcade name origin -
# "shoot down" a jumping opponent), and the harness's dummy cannot be
# scripted to jump (G-directive AI only, not frame-scriptable, same
# constraint noted for Ryu's hadouken WHIFF entries in corpus-ryu.yaml).
# A genuine HIT/BLOCK assertion for this move is therefore out of scope -
# documented here as a known gap, not attempted - and WHIFF (with its
