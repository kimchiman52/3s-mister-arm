# --- Moonsault Press (360 + P, command grab) --------------------------------
# Motion: cardinal-4 rotation + LP/MP/HP (see file header 360 verdict - no
# compiler change). hugo.json lists identical Startup=2/Hit=2/Recovery=36
# for all three strengths; measured S/A match exactly for all three
# (A=2 - contact IS registered, unlike Ryu's hadouken which has no player-
# side attack signal at all; this is a real melee grab, not a projectile,
# so none of the Phase 6A arcade-split machinery is involved: proj=0 on
# every FINAL line below). Unblockable (hugo.json Block_advantage="-";
# verified live: connects as HIT even with dummy:stand, i.e. a standing
# "guard" input does not stop it - the throw-bypasses-block mechanism
# already established for Q's CnDB/normal Throw). kd:1 per the CnDB
# precedent (Hit_advantage="-" -> explicit kd, same as corpus-q.yaml's
# q-cndb-*-hit / corpus-ryu.yaml's ryu-throw-hit).
#
# R diverges on HIT (measured 67 vs arcade 36) but is EXACT on WHIFF
# (h-moonsault-lp-whiff below: R=36) - the §13.10 HIT-R display
# convention (docs/frame-data-synthesis.md, Class 3 connected grab):
# arcade R is the whiff-path figure (captured exactly below); on HIT the
# grab connects and the overlay measures the real post-capture throw
# sequence instead, bounded here by the §13.6.1 partner-release path
# AND raw[] saturation at the FD_METER_LEN=72 cap (`frame_data_overlay.c:
# 42`) - the real capture-to-release span (102 wall ticks) exceeds the
# 72-cell buffer, so R saturates at `(FD_METER_LEN-1) - S - A = 71-2-2 =
# 67` for all three strengths (identical Startup/Hit=2/2 in hugo.json).
# This R expect is therefore a DERIVED value, not an independent
# constant: it moves in lockstep with FD_METER_LEN if that constant ever
# changes, and must be re-derived from the formula above, not
# re-measured from scratch.

- label: h-moonsault-lp-hit
  setup: { dist: close, dummy: none }
  input: "hold RIGHT 2; hold DOWN 2; hold LEFT 2; hold UP 2; hold RIGHT+LP 2; wait 1"
  qjson: { name: "Moonsault Press (Jab)" }
  outcome: HIT
  # BUFFER-1 (2026-07-13): the FD_CAPTURE_LEN 72->256 raise un-caps this
  # partner-release grab's raw[] capture — the `(FD_METER_LEN-1)-S-A`
  # derived-convention formula above (§13.10, "Raising FD_METER_LEN to
  # un-saturate the Hugo grabs was considered and rejected... it would
  # only trade one convention's R for another with no arcade oracle
  # either way") is now STALE: this fix trades exactly that rejected
  # trade, as a side effect of the M1 raise. Post-fix measured R=99 (was
  # 67); the three Moonsault buttons no longer share one uniform value
  # (100/98 on MP/HP below) since each button's true post-release span
  # differs slightly. R DE-ASSERTED (not re-derived to a new formula this
  # cycle — no arcade oracle exists for this post-contact span either
  # way, same as before); flagged prominently for orchestrator/user
  # review — this REOPENS the §13.10 "No FD_METER_LEN resize" decision,
  # not merely a re-measurement.
  expect: { S: from-qjson, A: from-qjson, kd: 1 }

- label: h-moonsault-mp-hit
  setup: { dist: close, dummy: none }
  input: "hold RIGHT 2; hold DOWN 2; hold LEFT 2; hold UP 2; hold RIGHT+MP 2; wait 1"
  qjson: { name: "Moonsault Press (Strong)" }
  outcome: HIT
  # BUFFER-1 (2026-07-13): same de-assert as h-moonsault-lp-hit above.
