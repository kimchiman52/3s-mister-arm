# Generated/consumed by tools/frame-data/compile_corpus.py against
# docs/arcade-frame-data/ibuki.json (fetched 2026-07-08 from
# https://raw.githubusercontent.com/Coccis77/thirdstrikedatabot/master/json/ibuki.json,
# md5 e011a003c2bb9644d50e9bc435267b00). CHARACTER_IDS key is "ibuki"
# (compile_corpus.py:44, id=7).
#
# SCOPE (user-directed 2026-07-08, cast rollout): normals ladder (all
# BLOCK-reachable rows + six-button close HIT sample + WHIFF sample at 250 +
# six crouching BLOCK rows) + all SIX command normals (Back+Strong,
# Towards+Short, Towards+Forward, Back+Forward, Down-Towards+Forward,
# Towards+Roundhouse - BLOCK+WHIFF each) + UOH (WHIFF/BLOCK/HIT) + Throw
# (WHIFF/HIT) + negative control + ground specials probe (ONE session
# budget): Raida (Jab) [hcb+P, task-flagged "Class 3 precedent" - empirically
# turned out to be a BLOCKABLE special, not the unblockable-grab shape seen
# elsewhere in this repo - see section below], Kasumi Gake [qcf+K,
# confirmed movement-only/zero-active], Tsumuji (Short) [qcb+K, multi-hit
# kicks], Kubiori [motion verified live to be hcf+P, NOT hcf+K as the task's
# tentative guess suggested - see section below], Kazekiri (Short)
# [dp-shape hold-chain + K, connects vs both standing and non-guarding
# dummies]. EXCLUDED per task: Kunai (airborne-capable projectile - the
# harness attacker cannot be scripted to jump for the air variant, and the
# grounded variant is out of this rollout's one-session budget), Hien
# (dash-in kick special, not in the task's specials list), all supers/EX,
# and all target-chain follow-ups out of Kasumi Gake (Kasumi Suzaku/Yoroi
# Doushi/Missed grab (Chi Blast)/Yami Shigure) - none of these are landed by
# a single press per the task's own target-chain exclusion.
#
# MOVE-NAME MAPPING / ENUMERATION (read the full ibuki.json before authoring,
# per CORPUS-AUTHORING.md Phase 1): 62 rows total. Every "Name" string was
# read exactly once via `python3 -c "import json; ..."` against the fetched
# file - see the per-section comments below for which named rows exist for
# each family and which are absent.
#
# FAR-NORMAL COVERAGE (a FOURTH distinct far-normal-gap shape in this repo,
# distinct from Yun/Oro/Yang's own gaps): ibuki.json has Far Jab/Far
# Fierce/Far Roundhouse but NO Far Strong, NO Far Short, NO Far Forward -
# verified against every Name string in the fetched oracle. MP/LK/MK's WHIFF
# rows below cite their own single row (Strong/Short/Forward), same
# convention as corpus-yang.yaml's Jab/Short/Roundhouse WHIFF entries.
#
# CROUCHING-HIT-ROW GAP: none of ibuki.json's six crouching rows are
# Hit_advantage="D" (all numeric or the literal "-") - BLOCK only per the
# non-D-row convention (no separate crouching HIT/WHIFF entries), same
# posture as corpus-yang.yaml's crjab/crstrong/crfierce/crshort/crforward.
#
# COMMAND-NORMAL COUNT: ibuki.json has SIX Towards/Back-prefixed rows (Back +
# Strong, Towards + Short, Towards + Forward, Back + Forward, Down-Towards +
# Forward, Towards + Roundhouse) - more than any other character in this
# repo so far, flagged in-task ("Ibuki has many command normals"). None are
# Hit_advantage="D" - each gets BLOCK+WHIFF per the non-D-row convention;
# two of the six (Down-Towards+Forward, Towards+Roundhouse) additionally get
# a HIT probe entry because it was the HIT-vs-BLOCK-vs-WHIFF comparison that
# surfaced/classified a real R divergence for each (same discipline as the
# Ken Towards-Roundhouse WHIFF-row precedent in CORPUS-AUTHORING.md Phase 4 -
# "adding the WHIFF row is what surfaced the divergence").
#
# Every expect below is pinned against a live trace
# (tools/frame-data/run.sh tools/frame-data/corpus-ibuki.yaml).
