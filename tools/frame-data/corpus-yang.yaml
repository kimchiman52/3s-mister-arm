# corpus-yun.yaml's own Zenpou Tenshin measurements - consistent with the
# two characters sharing this command grab's underlying move data (twins).

- label: yang-zenpou-lk-whiff
  setup: { dist: 250, dummy: none }
  input: "motion hcb LK"
  qjson: { name: "Zenpou Tenshin" }
  outcome: WHIFF
  expect: { S: from-qjson, A: from-qjson, R: from-qjson }

# §13.10 Class 3 connected-grab, endrel-bounded derived value (see section
# comment above): measured R=44 (T=53, endrel=1, R=T-S-A=53-7-2=44), same
# formula as yun-zenpou-tenshin-hit. Verified live: dummy:stand produces
# the IDENTICAL HIT outcome/numbers - an unblockable command grab, so no
# separate BLOCK entry exists for this move.
- label: yang-zenpou-lk-hit
  setup: { dist: close, dummy: none }
  input: "motion hcb LK; wait 60"
  qjson: { name: "Zenpou Tenshin" }
  outcome: HIT
  expect: { S: from-qjson, A: from-qjson, R: 44, kd: 1 }

