# SCOPE (user-directed 2026-07-08, cast rollout): normals ladder (six-button
# close BLOCK/HIT + WHIFF sample + three far-normal BLOCK rows + all six
# crouching BLOCK + HIT for the two "D"-marked rows + the one Towards+X
# command normal BLOCK+WHIFF) + UOH (WHIFF/BLOCK/HIT) + Throw (WHIFF/HIT) +
# negative control + ground specials probe (ONE session budget): Tourou Zan
# (yang.json's "Tourou Zan (Jab/Strong/Fierce/EX)", rekka, qcf+P, Jab
# strength only - PLUS a rekka-chain probe testing whether
# repeated/alternating punch presses after the first rekka land a 2nd/3rd
# hit), Senkyuutai (yang.json's "Senkyuutai (Short/Forward/RH/EX)", qcf+K,
# Short strength only), Byakko Soushouda (single-row palm special, qcb+P),
# Zenpou Tenshin (command roll-grab, motion hcb+K - Yun precedent, `motion
# hcb <K>` macro, already implemented for Chun-Li's Hazan Shu, zero new
# code). ALL FOUR specials landed on the FIRST motion-probe attempt (S
# values match yang.json's own Startup fields exactly: 8/8/21/7
# respectively) - zero compile_corpus.py changes. EXCLUDED per task: Dive
# Kicks (airborne - the harness dummy/attacker cannot be scripted to jump)
# and all supers/EX (Sei-ei Enbu is Yang's SA; Tourou Zan (EX)/Senkyuutai
# (EX) also excluded). Kaihou (Short/Forward/RH), Raishin Mahhaken, and
# Tenshin Senkyuutai are not in this rollout's specials list - not probed,
# documented as an open gap (same posture as prior characters' out-of-scope
# specials).
#
# REKKA-CHAIN FINDING (Tourou Zan): probed BOTH a same-button repeated-press
# chain (`motion qcf LP; press LP; press LP`) and an alternating-punch chain
# (`motion qcf LP; press MP; press HP`) against a BLOCKING dummy - both
# produce numbers BYTE-IDENTICAL to the single-rekka BLOCK entry
# (S=8/A=5/R=22/adv=-1, one FINAL only in the window either way). Per the
# task's own fallback instruction ("if only the first rekka lands cleanly,
# author that and document"): only the FIRST hit of Tourou Zan lands within
# either probed chain shape: no second/third rekka hit was observed. Only
# the single-hit Jab-strength entries are authored below; the chain probes
# themselves are not committed as corpus entries (they duplicate the
# single-hit numbers exactly and add no new signal).
#

# FAR-NORMAL COVERAGE: yang.json has "Far Strong"/"Far Fierce"/"Far Forward"
# rows but NO "Far Jab"/"Far Short"/"Far Roundhouse" - verified by reading
# every Name string in the fetched oracle. This is a THIRD far-normal-gap
# shape in this repo (distinct from Oro's missing-Fierce/Roundhouse-only and
# Yun's missing-Short/Roundhouse-only): Yang additionally lacks Far Jab,
# which every other far-normal-bearing oracle in this repo (ryu/ken/akuma/
# chunli/oro/q/yun) carries. Jab/Short/Roundhouse WHIFF-at-250 below cite
# their own single row, same convention as Oro's Fierce/Roundhouse.
#
# THROW NAMING: yang.json carries THREE throw-family rows - "Neutral Throw"
# (idx 26), "Back Throw" (idx 27), "Towards Throw" (idx 28) - the same
# three-way split as ken.json, all numerically identical
# (S=2/Hit=1/Recovery=21/Block_advantage=0/Hit_advantage="D"/Throw_range=18).
# "Neutral Throw" used below (plain `press LP+LK`, no direction), same
# convention as corpus-ken.yaml's ken-throw-hit.
#
# D-NOTATION: yang.json marks THREE rows Hit_advantage="D" - standing
# Forward (idx 14), Crouching Roundhouse (idx 19), and the throw family (all
# three throw rows). kd is explicit-only (never from-qjson, Phase 3
# discipline) - each measured live independently below.
#
# yang.json's Startup/Hit/Recovery/*_advantage fields are JSON strings; only
# genuinely non-numeric fields ("-", "D") need an explicit literal.
#
# Every expect below is pinned against a live trace
# (tools/frame-data/run.sh tools/frame-data/corpus-yang.yaml).
