# docs/arcade-frame-data/yang.json (fetched 2026-07-08 from
# https://raw.githubusercontent.com/Coccis77/thirdstrikedatabot/master/json/yang.json,
# md5 4701f59a68fb49caa9ebaaefaeb40674). CHARACTER_IDS key is "yang"
# (compile_corpus.py:47, id=10).
