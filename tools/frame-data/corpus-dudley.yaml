# Landed via the EXISTING DP-shape hold-chain (same recipe as Ken's
# Shoryuken / Yun's Tetsu Zankou / Makoto's Fukiage). UNLIKE Makoto's
# Fukiage / Hugo's Shootdown Backbreaker, this move DOES connect against a
# grounded standing/non-jumping dummy - verified live (BLOCK/HIT both
# produce a real FINAL, not a SHAPE mismatch) - so BLOCK/HIT are NOT a
# harness-gap for this move; all three outcomes are audited (WHIFF above,
# BLOCK/HIT below).
#
# JET UPPERCUT FINDING - FLAGGED PROMINENTLY (not a routine UNCLASSIFIED;
# see file header ISSUE #17 CENSUS). S matches dudley.json exactly on every
# strength/outcome (unambiguous identification). Full data table (measured
# A / arcade A / lever-F-off A):
#   BLOCK: Jab 12/8/10 (+4 real-binary, +2 residual with lever off)
#          Strong 20/16/20 (+4 real-binary, UNCHANGED with lever off)
#          Fierce 25/21/23 (+4 real-binary, +2 residual with lever off)
#   HIT:   Jab 16/8/14 (+8 real-binary, +6 residual with lever off)
#          Strong 16/16/16 (EXACT MATCH, both with and without lever - no
#                            divergence at all for this strength/outcome)
#          Fierce 17/21/15 (-4 real-binary UNDERCOUNT, -6 with lever off)
# BLOCK's own A-overcount is a UNIFORM +4 across all three strengths in the
# real binary. HIT is NOT uniform at all: Jab overcounts (+8), Strong is
# exact (no divergence), Fierce UNDERCOUNTS (-4) - a genuine sign flip
# across strengths on the same outcome, something no prior character's #17
# finding has shown. Lever-F's own behavior is equally irregular: it adds
# exactly 2 units of credit on BLOCK-Jab/BLOCK-Fierce/HIT-Jab/HIT-Fierce
# (sometimes WORSENING an already-overcounting entry, sometimes partially
# CLOSING an undercount - the SAME +2 magnitude, opposite net effect
# depending on which side of arcade the pre-lever value sits) while doing
# NOTHING AT ALL on BLOCK-Strong/HIT-Strong. This does not match the
# established "either fully restores to an arcade-exact match (shape b) or
# never fires (shape a1)" dichotomy from any prior character - flagged here
