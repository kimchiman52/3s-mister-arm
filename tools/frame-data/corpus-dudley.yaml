# --- Throw (LP+LK) -----------------------------------------------------------
# dudley.json's Throw_range field is 20px for both throw-family rows (see
# file header naming note). ORDERING NOTE (§12.1 row 1 "predecessor-outcome
# ordering" precedent, corpus-hugo.yaml:439-450): Throw is deliberately
# placed LAST (immediately before the negative control) rather than in its
# conventional position right after UOH - a connecting command-grab's
# residual knockdown-recovery ticks corrupted the FOLLOWING entry's distance
# teleport when Throw sat mid-corpus (verified live: the entry immediately
# after it read a bled-over, mislabeled FINAL from Throw's own delayed
# grab-check window, the exact g_cur.active-latch mechanism Phase 5 warns
# about). Nothing distance-sensitive follows Throw now except the negative
# control, which only checks for the ABSENCE of a FINAL and is unaffected.
#
# DISTANCE/TIMING NOTE: dist:20 (exactly Throw_range) and dist:18 both
# proved unreliable in isolated probing (dist:18 produced NO-DATA; dist:20
# connected but with a garbage `adv` reading) - dist:8 through dist:16 all
# connected identically and cleanly. dist:12 is used below (consistent with
# this repo's existing command-grab convention, corpus-makoto.yaml's
# Karakusa / corpus-yun.yaml's Zenpou Tenshin). The HIT entry's own `wait`
# was also widened from the 90-frame Makoto/Yun precedent to 110 frames:
# an isolated probe measured this grab's own FINAL firing at raw_len=72
# (T=72, one frame beyond Ken/Hugo's usual T=71 saturation ceiling) roughly
# 250 frames after MOVE_START - with the default 150-frame
# `inter_entry_wait`, a 90-frame post-press wait leaves only ~243 frames of
# window, just short of the ~251 frames actually needed; 110 frames
# comfortably covers it.

- label: dudley-throw-whiff
  setup: { dist: 250, dummy: none }
  input: "press LP+LK"
  qjson: { name: "Neutral Throw" }
  outcome: WHIFF
  expect: { S: from-qjson, A: from-qjson, R: from-qjson }

- label: dudley-throw-hit
  setup: { dist: 12, dummy: none }
  input: "press LP+LK; wait 110"
  qjson: { name: "Neutral Throw" }
  outcome: HIT
  expect: { S: from-qjson, A: from-qjson, kd: 1 }

