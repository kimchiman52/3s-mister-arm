# CLOSE ROUNDHOUSE R FINDING (UNCLASSIFIED, flagged 2026-07-08, needs
# follow-up classification): measured R=19 vs arcade 25 (-6) on BOTH BLOCK
# and HIT identically; S/A/adv exact on both. NO clean WHIFF baseline is
# reachable for the CLOSE Roundhouse animation - a dedicated placement
# probe (dist=65/75/85/95, isolated scratch corpus) showed dist<=75 still
# CONNECTS with the close animation (S=5 A=8) while dist>=85 switches to
# the FAR Roundhouse animation (S=9 A=5, whose own dist-250 WHIFF row
# below is exact) - so whether the -6 is an item-18-style truncation
# (which would normally be whiff-confirmed) cannot be established for this
# move. Does NOT fit Phase 6 item 4 (Hugo-Roundhouse family reads R HIGH,
# this reads LOW), does not fit §13.10 Class 1 (BLOCK diverges too), and
# is not a whiff divergence (no whiff observable - Phase 4's STOP rule not
# tripped). Trace facts (raw observations, IDENTICAL on both outcomes):
# T=36, raw_len=36, cut=0, dwellbrk=0, endrel=0; TWO same-tick cg_ix
# jumps - 4->12 EARLY in startup (2 ticks after MOVE_START, before
# contact; A is exact so it demonstrably costs nothing) and 24->32 DEEP
# in the recovery-only portion (well after the active window closes) -
# the same two-jump signature ken-twdshk-block's trace showed alongside
# its own R deficit. Noted as trace facts only, not a mechanism.
# HYPOTHESES ONLY (unverified, same candidates as ken-twdshk-block): (1)
# a recovery-cell skip-jump analogue of shape (a1) (declared recovery
# cells never dispatched, manifesting as R instead of A - the 24->32
# jump would be the site), or (2) an item-18-like anim-cut truncation on
# the recovery tail that a whiff row would confirm if one were
# reachable. Flagged to orchestrator for follow-up.
# CLASSIFIED 2026-07-09 (classification sweep, fresh per-tick trace on
# this move; docs/frame-data-synthesis.md §12.2.2): member of the
# contact-branch recovery-shortening family = §13.10 Class 1 generalized-
# to-contact (mechanism trace-PROVEN on ken-twdshk-block and
# akuma-twdsmp-block; this move shows the identical signature - the
# recovery jump 24->32 fires identically on BLOCK and HIT, R=19 both,
# T=36 both, S/A/adv exact). The earlier "does not fit Class 1 (BLOCK
# diverges too)" objection is retired: chunli-crfierce already
# generalized Class 1 to contact (BLOCK+HIT both shortened). Because the
# close animation has no reachable whiff, the -6 rests on the arcade
# table figure rather than a same-animation whiff row - membership is by
# identical mechanism signature, stated as such in the entries below.
# §13.13 contact-path convention (adopted 2026-07-10, user decision): R=19 is
# the engine-truth recovery actually played on the BLOCK path per the
# CLASSIFIED §12.2.2 finding above. Arcade (whiff-canonical) R=25 - preserved
# here per the convention. S/A/adv remain arcade-exact (from-qjson).
