# Akuma (Gouki) frame-data corpus (cast rollout, user-directed 2026-07-08).
# Generated/consumed by tools/frame-data/compile_corpus.py against
# docs/arcade-frame-data/akuma.json (fetched 2026-07-08 from
# https://raw.githubusercontent.com/Coccis77/thirdstrikedatabot/master/json/akuma.json,
# md5 0add1a92a2bdaa58f370f285abeb4d49). CHARACTER_IDS key is "akuma"
# (compile_corpus.py:51, id=14) - the game's internal Character enum spells
# this character "Gouki" (src/constants.h, the pl14*/eff* source files), but
# the oracle repo and this corpus's `character:` key/label prefix both use
# "akuma" throughout.
#
# NAMING NOTE (runbook Phase 1 caution re: throw-family naming varying per
# character): akuma.json's throw-family rows are a bare "Throw" and "Back
# Throw" (NOT "Neutral Throw" - a third distinct convention after
# ryu/q's bare "Throw" and ken/urien's "Neutral Throw"). Both rows share
# Startup=2/Hit=1/Recovery=21/Throw_range=24/Block_advantage=0;
# Hit_advantage is NUMERIC for both (45 / 70) rather than the "D" literal -
# the same shape as ryu.json's own Throw row (Hit_advantage=45), whose
# corpus precedent (ryu-throw-hit) documents the observed live adv (+82)
# NOT matching that 45 and leaves adv unasserted ("large-number-on-
# knockdown convention"). Verified against the fetched oracle, not assumed.
#
# FAR-NORMAL COVERAGE: akuma.json has Far Jab/Far Strong/Far Fierce/Far
# Forward/Far Roundhouse rows (no Far Short - same single-row-Short gap as
# ken.json/ryu.json). All five Far rows are audited (BLOCK, and as the
# dist-250 WHIFF-sample row for their button).
#
# ALL SIX crouching normals exist. Crouching Roundhouse's Hit_advantage is
# a NUMERIC "28" (not the "D" literal ken.json uses for the identical
# sweep) - verified live: measured adv=+28 with kd=1 on HIT, an exact
# oracle match, so adv IS asserted from-qjson on akuma-crroundhouse-hit
# (unlike every "D"-oracle sweep precedent, where adv is unassertable).
#
# ONLY ONE Towards+X command normal exists: "Towards Strong" (no other
# Towards rows). Audited with BLOCK+WHIFF per Phase 4; not "D"-annotated,
# so no command-normal HIT entry (Dudley/Makoto/Urien precedent).
#
# akuma.json's numeric fields are JSON strings ("Startup": "3") -
# resolve_from_qjson's int() cast handles this; only genuinely non-numeric
# fields ("-") need an explicit literal or an outright skip.
#
# SCOPE (user-directed 2026-07-08, cast rollout): shoto ladder (six-button
# close BLOCK/HIT + WHIFF sample + five far-normal BLOCK rows + all six
# crouching BLOCK + Crouching Roundhouse HIT + the one Towards+X command
# normal BLOCK+WHIFF) + UOH (WHIFF/BLOCK/HIT) + Throw (WHIFF/HIT) +
# negative control + specials probe (ONE session budget): Gou Hadouken
# (motion qcf + P, three strengths BLOCK+HIT - exercises the projectile
# arcade-split lever D on a FIFTH character; akuma.json has only ONE
# undifferentiated "Gou Hadouken" row shared by all three strengths,
# unlike ryu.json/ken.json's per-strength rows), Gou Shoryuken (DP-shape
# hold-chain, Jab strength only per the Ken-precedent one-strength
# budget - akuma.json splits Shoryuken by strength with Startup 3/2/1 for
# Jab/Strong/Fierce), Tatsumaki Zankuu Kyaku (GROUND version, motion qcb +
# K, Short strength only, existing macro - the "Air Tatsumaki Zankuu
# Kyaku" rows are a separate airborne-only family, out of scope), Hyakki
# Shuu (demon flip, DP-shape hold-chain + K - despite the task's
# "partially airborne" caution, ALL THREE outcomes proved fully assertable
# with zero divergence, see that section), Ashura Senkuu (teleport,
# movement-only, DP-shape hold-chain + 3P chord - Dudley Ducking Rush
# precedent, see that section for the four-variant probe record and what
# is/isn't assertable). Zankuu Hadouken (air fireball) EXCLUDED per the
# task instruction (airborne - the attacker cannot be scripted to jump,
# docs/frame-data-synthesis.md §12.1). NO supers/EX/Raging Demon (Messatsu
# Gou Hadou / Tenma Gou Zankuu / Messatsu Gou Shoryuu / Messatsu Gou Rasen
# (Ground/Air) / Shun Goku Sastu [oracle's own spelling] / Kongou
# Kokuretsu Zan all excluded per the task charter). Shakunetsu Hadouken
# (three strength rows) is NOT in the task's specials list - not probed.
# Hyakki Goushou/Goujin/Gousai (the demon flip's own followup attacks,
# each with their own oracle rows) are a separately-inputted family out of
# this session's budget - documented as an open gap, not probed. Dive
# Kick (air-to-ground, thrown mid-jump only) excluded for the same
# cannot-script-a-jump reason as every Jumping/Neutral Jumping row.
#
# Every expect below was pinned against a live trace
# (tools/frame-data/run.sh tools/frame-data/corpus-akuma.yaml), and every
# quoted measured value below was re-reconciled against the FINAL
# full-corpus run of this session (per the Urien review-cycle lesson:
# values quoted from earlier isolated probes are re-checked against the
