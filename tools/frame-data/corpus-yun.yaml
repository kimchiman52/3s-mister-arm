#           generalized here to "on contact" rather than "on HIT" alone
#           (the Chun-Li chunli-crfierce-hit precedent for this
#           generalization, corpus-chunli.yaml:120-135, since the WHIFF
#           baseline independently confirms the true arcade R, licensing the
#           established §13.10 Class 1 bucket instead of leaving this
#           UNCLASSIFIED).
#
#   - yun-farfierce-block: the SAME compound shape as Roundhouse above:
#       (1) shape (a1) A-undercount: measured A=1 vs arcade 2. Lever-F test:
#           A=1 UNCHANGED.
#       (2) §13.10 Class 1 R-deficit (generalized to "on contact"): measured
#           R=21 vs the WHIFF-confirmed arcade R=23 (yun-hp-whiff below
#           matches exactly).
#
#   - yun-crfierce-block: a THIRD compound finding, but with a twist on
#     clause (2):
#       (1) shape (a1) A-undercount: measured A=2 vs arcade 4. Lever-F test:
#           A=2 UNCHANGED (same batch, same scratch build).
#       (2) an R-side SURPLUS (not a deficit): measured R=16 vs the
#           WHIFF-confirmed arcade R=15 (yun-crfierce-whiff below matches
#           yun.json's Recovery=15 exactly) - the OPPOSITE sign from clause
#           (2) above and from every §13.10 Class 1 precedent in this repo
#           (Class 1 is defined as "genuinely SHORTER," never longer).
#           Doesn't fit Phase 6 item 4 (Hugo Roundhouse "R-side contact
#           surplus" family) either - that bucket explicitly requires A
#           EXACT, and here A is NOT exact (shape (a1) undercount, clause 1
#           above). UNCLASSIFIED (flagged 2026-07-08, needs follow-up
#           classification) - TRACE OBSERVATION ONLY: the R-surplus is
#           contact-specific (WHIFF is clean) and sign-INCOHERENT with every
#           established R-divergence bucket in this file; no mechanism
#           claimed. Flagged to orchestrator for follow-up classification.
#
#   No other #17-family divergence was found on any other normal, crouching
#   normal, command normal, UOH's S, Throw, or any of the four audited
#   specials (every other entry's A matches yun.json exactly).
#
#   UPDATE (2026-07-10, §13.13): yun-strong-block/-hit and yun-crjab-block
#   (pure, single-clause shape (a1)) convert to a plain PASS asserting the
#   measured A citing §13.13. yun-roundhouse-block/-hit, yun-farfierce-block,
#   and yun-crfierce-block (all COMPOUND) narrow to their clause-(2) R-side
