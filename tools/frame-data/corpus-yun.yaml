# A exact everywhere, no issue-#17 clause). The divergence is entirely on
# R, and its SIGN FLIPPED with the §13.5.1a fix:
#   - Pre-fix (legacy level-test anchor): measured R=1/4/2
#     (whiff/block/hit) vs arcade's uniform 6 - an UNDERSHOOT produced by
