#     end now reads R=10 (whiff) / R=12 (block, adv -9) / R=10 (hit,
#     adv -4): an OVERSHOOT vs arcade's 6 on every outcome.
# NEW SUB-FINDING, UNCLASSIFIED-pending (docs/frame-data-synthesis.md
# item 18(c)): a former item-18 member whose NO-CUT value overshoots the
# oracle - the opposite sign from residual item 18(b) (grounded
# fresh-edge early-cut), so it must NOT be folded into that bucket; and
# not a §13.5.1a false-cut either (the gate's refusal is correct - the
# old cut was the trace-proven shape-B misfire). Where the oracle's 6
# comes from is the open question; no mechanism hypothesized.
# SECTION ACCOUNTING: still 100% xfail on the R field (3/3) - now a
