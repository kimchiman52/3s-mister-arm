# downstream consequence of the same truncation, cited in the same xfail
# string, same convention as Chun-Li's Far Roundhouse.
#
# ============================================================================
# UOH FINDING - RE-CITED 2026-07-08 (§13.5.1a grounded fresh-edge cut
# gate; supersedes the same-day per-path RECLASSIFICATION, whose values
# and cut-window framing described the pre-fix false cut).
# (yun-uoh-whiff/-block/-hit). S=15/A=9 match yun.json's Universal
