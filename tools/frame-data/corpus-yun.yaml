# Yun frame-data corpus (cast rollout, user-directed 2026-07-08).
# Generated/consumed by tools/frame-data/compile_corpus.py against
# docs/arcade-frame-data/yun.json (fetched 2026-07-08 from
# https://raw.githubusercontent.com/Coccis77/thirdstrikedatabot/master/json/yun.json,
# md5 cc49322b0fcd04e617f22b0410a658fa).
#
# NAMING NOTE (runbook Phase 1 caution re: throw-family naming varying per
# character): yun.json carries TWO throw-family rows - "Neutral Throw"
# (index 26) and a bare "Throw" (index 27) - a THIRD naming shape beyond
# ryu.json/q.json's single bare "Throw" and ken.json's three-way
# Neutral/Back/Towards split. Both rows share identical Startup=2/Hit=1/
# Recovery=21/Block_advantage=0/Hit_advantage="D"/Throw_range=18 - they only
# differ in Damage/Stun/Bar_gain (fields this corpus doesn't assert), so
# either name is numerically interchangeable for this file's purposes;
# "Neutral Throw" is used below for consistency with the other qjson.name
# strings (verified against the fetched oracle, not assumed).
#
# yun.json's Startup/Hit/Recovery/*_advantage fields are JSON strings (e.g.
# "Startup": "3") rather than the bare ints seen in some other oracles -
# resolve_from_qjson's `int(raw)` cast (compile_corpus.py:432-448) handles
# this transparently; only genuinely non-numeric fields ("-", "D") need an
# explicit literal, same discipline as every other corpus in this repo.
#
# SCOPE (user-directed 2026-07-08, cast rollout): normals ladder (six-button
# close BLOCK/HIT + WHIFF sample + crouching + command normals with their own
# WHIFF rows, per Phase 4) + UOH + Throw + negative control + ground specials
# probe (one session budget): Zesshou Hohou (lunge punch, qcf+P), Tetsu
# Zankou (shoulder, motion-probed - DP-shape hold-chain, same recipe as the
# Ken Shoryuken / Hugo Shootdown Backbreaker precedent - landed on the FIRST
# probe attempt), Nishou Kyaku (upkicks, DP-shape hold-chain + kick), Zenpou
# Tenshin (command roll-grab, motion-probed - `motion hcb <K>` landed on the
# FIRST probe attempt, same macro as Chun-Li's Hazan Shu). ALL FOUR targeted
# specials landed with ALREADY-EXPRESSIBLE primitives - zero
# compile_corpus.py changes. EXCLUDED per task: Dive Kicks (airborne - the
# harness dummy/attacker cannot be scripted to jump, known gap
# docs/frame-data-synthesis.md §12.1) and Genei-Jin/You Hou/Sourai
# Rengeki/all EX variants (supers/EX are Step 13a/13b's charter, not this
# rollout's). Kobokushi (a target-combo-adjacent move, not named in this
# rollout's scope) is also not audited here.
#
# Every expect below was pinned against a live trace
# (tools/frame-data/run.sh tools/frame-data/corpus-yun.yaml), with every
# suspicious/ambiguous finding re-verified in an isolated single-entry probe
# corpus per the runbook's Phase 5 "known traps" discipline before being
# trusted.
#
# ============================================================================
# ISSUE #17 FAMILY CENSUS (per runbook item 6 / Phase 6 instruction). Every
# A-divergence below was lever-F-tested (fd_restore_revoked_declared_credit
# forced to 0 on a scratch build, src/sf33rd/Source/Game/engine/charset.c:507,
# reverted via `git checkout` + rebuild + re-verified green before this
# commit, same-binary protocol throughout, batched per Phase 8's
# same-binary discipline).
#
#   - yun-strong-block/-hit: classic shape (a1) skip-jump A-undercount.
#     Measured A=1 vs arcade 3; S/R/adv exact on both outcomes. Lever-F test:
#     A=1 UNCHANGED with the restore forced off - no revoke fires here,
#     ruling OUT a lever-F regression, confirming shape (a1) (credit
#     unrecoverable, synthesis §13.11 "what stays unrecoverable").
#
#   - yun-crjab-block: same shape (a1) family. Measured A=1 vs arcade 2;
#     S/R/adv exact. Lever-F test: A=1 UNCHANGED.
#
#   - yun-roundhouse-block/-hit: COMPOUND finding, two independent
#     divergences stacked on the same move:
#       (1) shape (a1) A-undercount: measured A=2 vs arcade 4 on BOTH BLOCK
#           and HIT (consistent between outcomes). Lever-F test: A=2
#           UNCHANGED - shape (a1), not a lever-F regression.
#       (2) ADDITIONALLY an R-side deficit: measured R=21 vs the
#           WHIFF-confirmed arcade R=22 (yun-hk-whiff below matches
#           yun.json's Recovery=22 exactly) on BOTH BLOCK and HIT identically
