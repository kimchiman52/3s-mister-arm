# A DISPOSITION — CORRECTED (2026-07-13, EXSUPER-1 closing cleanup, P-1
# corrective). This file previously cited §13.11's declared-credit
# convention and asserted A=15 as a plain PASS on both legs, reasoning that
# "path-independence across BLOCK and HIT is itself the defining, confirming
# property of this convention." That reasoning does not hold: the
# `fd_reset_move()` MOVE_START-vs-`char_move()` tick-ordering race
# documented at docs/frame-data-synthesis.md §12.2.4 :978 (SA-WHIFF-A/D2)
# is ALSO path-independent by construction — it fires identically on every
# leg of a move, including WHIFF (confirmed directly on Alex SA2/Ibuki SA2/
# Ken SA1/Akuma SA2, this same cleanup) — so path-independence alone cannot
# discriminate a genuine declared-credit truth from a race artifact; it is
# necessary but not sufficient, and this file previously treated it as
# sufficient.
#
# An offline declared-credit ledger walk was run to settle it (charset.c:
# 454-541 accumulator, isolated single-entry re-probe of each leg,
# <sp>/exsuper/review/probes/remy-sa2-{block,hit}.yaml, clean/untruncated
# window per the tail check — jatix/jcaix are 0 for 30+ ticks past
# atk_idle_F on both legs). Result at the time: ledger total=10 on BOTH
# legs — matching NEITHER the displayed engine_a=15 NOR the oracle 16, this
# move being heavily hitstop-entangled (40/50 jatix-live ticks carry
# nonzero P1.hstop on BOTH legs, vs 0/14-30/43 on Alex SA2's own
# clean-ledger legs).
#
# CORRECTED (ENGINE-D2 closure, 2026-07-13): the ledger-walk total=10 was
# ITSELF WRONG, not a genuine third value — arithmetically self-refuting
# for a credit-DROPPING race. `fd_movestart_same_tick_credit_hold`'s own
# mechanism can only ZERO or PRESERVE a cell's credit, never inflate it
# (`frame_data_overlay.c`'s reset-site branch either preserves
# `fd_prev_active_cgix_add[i]` exactly or zeroes it) — so the true engine
# ledger total can never be BELOW the displayed value, only at or above it.
# A ledger total (10) strictly LESS than the displayed value (15) is
# therefore impossible for this mechanism, proving the offline ledger
# walk's OWN model diverged (the naive charset.c cg_ctr-snapshot model
# under-credits hitstop-frozen cells, per the hitstop-entanglement note
# below), not the accumulator math it was trying to measure. The correct
# comparison is the mechanical ENGINE-D2 delta (+1, the same-tick preserve
# on this move's first active cell) applied directly to the pre-fix
# displayed value: 15+1=16 == oracle exactly — reproduced by the actual
# fix (not merely predicted): post-fix measured A=16 on both legs.
# Hitstop-entanglement note (retained, explains the FLAWED ledger walk,
# not the true value): the per-cell cg_ctr snapshot at cell-entry reads 1
# throughout even though hitstop extends each cell's real-time dwell to ~5
# ticks, so the naive charset.c accumulator model under-credits relative
# to what the live engine_a accumulator actually computes for a
# hitstop-frozen cell — the same class of limitation the Q2/D2 walk
# flagged for Dudley SA1's own cghi-dwell commit-state-machine
# (docs/frame-data-synthesis.md §12.2.4 :978).
#
# A is now asserted `from-qjson` on both legs, plain PASS — no longer
# OMITTED. The synthesis-docs "ledger-neither (10)" record is corrected by
# this note.
#
