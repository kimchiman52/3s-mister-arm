# ============================================================================
# ORDERING FINDING (NEW harness limitation, this session) — LOV-FAMILY
# ADJACENCY CORRUPTION. A Light of Virtue EX attempt (High OR Low strength,
# ANY outcome including a clean WHIFF with zero contact) leaves the move-id's
# own engine state such that the VERY NEXT Light-of-Virtue-family attempt's
# MOVE_START never registers: the trace instead reports a degenerate FINAL
# (S=0, a fixed A/R/adv signature byte-identical across every reproduction —
# e.g. S=0 A=66 R=0 adv=+20 recurred identically in three independent scratch
# probes at inter_entry_wait 250/300/600, ruling out a settle-time race —
# this is a stable misattribution, not noise). A DIFFERENT move family
# (Rising Rage Flash / Cold Blue Kick, tested here) is immune both ways: it
# always re-syncs cleanly regardless of what preceded it, and its own
# contact never poisons a LOV attempt that follows it. Confirmed empirically
# (5 scratch probes, <sp>/ex-remy/probe1..8*.yaml, run1..8): a plain,
# larger inter_entry_wait does NOT fix it (probe3, wait=600, same exact
# corrupted reading) — only a different-family spacer between every pair of
# LOV-family entries does. This file's entry order alternates every LOV
# entry with an RRF-EX or CBK-EX entry for exactly this reason; do not
# reorder without re-verifying (a determinism/reorder regression here would
# silently misattribute an entry's own numbers to the wrong move, worse than
# a simple FAIL). Flagged for the tooling program's own §12.1-style register
# (harness limitation, not an engine/oracle divergence) — no fix attempted
# here (out of this satellite's scope; RRF/CBK spacers make every needed
# leg reachable without one).
#
# ============================================================================
# LOV DUPLICATE-ROW FINDING (the wave-5-flagged "hotspot", resolved
# empirically, NOT by assumption — same class as the already-documented DHA
# fast/long-charge duplicate-Name rows, CORPUS-AUTHORING.md Phase 1).
# remy.json has TWO rows each for "Light of Virtue (EX High)" (index 0 =
# row 32: Recovery=24/Block_advantage=4; index 1 = row 37: Recovery=28/
# Block_advantage=0) and "Light of Virtue (EX Low)" (index 0 = row 33:
# Recovery=24/Block_advantage=4; index 1 = row 38: Recovery=28/
# Block_advantage=0) — Startup=8 identical on all four, so S cannot
# disambiguate. This repo's ONLY known motion recipe for LOV EX (charge-back
# 60 then-forward, final button chorded per the strength — see MOTION
# RECIPES below) empirically reaches:
#   - EX High -> index 0 (row 32, R=24/adv=4) — measured R=24 exactly on
#     WHIFF/BLOCK/HIT, no divergence. Ships with the DEFAULT qjson index
#     (index omitted = 0).
#   - EX Low -> index 1 (row 38, R=28/adv=0) — measured R=28 exactly on
#     BLOCK/crouch/HIT (LOV Low's own WHIFF is unreachable, see below), no
#     divergence. Ships with explicit `qjson: {index: 1}`.
# The OTHER duplicate row for each strength (EX High row 37, EX Low row 33)
# has NO known recipe to reach with this harness — same disposition as the
# already-accepted "DHA long-charge variant recipe unknown" gap
# (CORPUS-AUTHORING.md Phase 5 known-traps register): documented here as an
# honest gap, not guessed at, not asserted.
