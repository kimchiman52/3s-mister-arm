# ============================================================================
# MOTION RECIPES (Phase 5 motion-probe method, reusing corpus-remy.yaml's
# own established base-move motion identities — "motion charge-back 60
# then-forward <BTN>" for Light of Virtue, "motion charge-down 60 then-up
# <BTN>" for Rising Rage Flash, "motion qcb <BTN>" for Cold Blue Kick — with
# the final step's button replaced by a two-button chord via `hold`,
# identical workaround to every sibling EX corpus in this program since
# `cmd_motion` only accepts a single button token per motion arm while
# `hold`'s chord parser takes '+'-joined tokens):
#   - Light of Virtue (EX High): `hold LEFT 60; hold RIGHT+LP+HP 2; wait 1`
#     — same 60-frame charge as corpus-remy.yaml's own LOV Jab/Short
#     entries, two punches chorded onto the snap step.
#   - Light of Virtue (EX Low): `hold LEFT 60; hold RIGHT+LK+HK 2; wait 1`
