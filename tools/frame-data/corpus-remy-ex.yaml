#   - Rising Rage Flash (EX): `hold DOWN 60; hold UP+LK+HK 2; wait 1` — same
#     60-frame charge as corpus-remy.yaml's own RRF (Short) entry (K-only
#     family per remy.json — Short/Forward/RH/EX all K-strength, no P
#     variant exists), two kicks chorded on.
#   - Cold Blue Kick (EX): `hold DOWN 2; hold DOWN+LEFT 2; hold LEFT+LK+HK 2;
#     wait 1` — manual qcb step sequence (DOWN/DOWN+LEFT/LEFT, mirroring
#     `motion qcb <BTN>`'s own internal steps since P1 faces right, so "qcb"
#     is DOWN then DOWN+BACK then BACK), two kicks chorded onto the final
#     step (CBK is also K-only per remy.json).
