# A=66/R=0/adv=+20, notably NOT matching the standing-BLOCK leg's own A=36/
# R=24/adv=+21 — a real, reproducible difference between guard states,
# confirmed byte-identical in an isolated single-entry re-verification with
# zero predecessor, <sp>/ex-remy/probe6.yaml). EX High is therefore a
# genuine mid/overhead-capable attack that connects against crouchers in
# this engine build — the opposite structural fact from its own base move,
# exactly the "test, don't inherit blindly" result the wave-5 guidance
# names. R/adv are NOT asserted for the crouch leg (no oracle field is
# comparable to this guard-state-specific value; only S is safely
# assertable, same posture as any structural-finding entry with no numeric
# oracle counterpart).
