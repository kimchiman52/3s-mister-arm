# --- Hadouken (projectile), Step 5 -----------------------------------------
# Exercises the arcade-split machinery landed in 468cb84c (Steps 1-2): the
# player WORK never fires its own cg_ja.atix for a fireball (the attack lives
# on the eff13 "tama" effect WORK instead), so the overlay anchors S/R on the
# projectile-spawn frame (proj_seen && !use_hatt) rather than the generic
# per-frame tally. Verified live (this session): spawn slot 10, meter_len 46
# for LP/MP/HP alike -> S=10 R=36 T=46, exactly ryu.json's Hadouken row for
# all three strengths (Jab/Strong/Fierce share identical Startup=10/
# Recovery=36/Block_advantage=-9 in ryu.json - the projectile's spawn timing
# and travel don't depend on strength). NO expect.A anywhere in this section:
# ryu.json's "Hit" (active-frame) field is the literal string "-" for every
# Hadouken row, and Startup/Recovery are the only fields the harness can
# assert - see compile_corpus.py's resolve_from_qjson, which raises
# CompileError on a non-numeric oracle field, so expect.A:from-qjson is not
# just unhelpful here, it doesn't compile.
#
# Distance calibration (Block_advantage is measured DISTANCE-DEPENDENT, not
# a corpus-authoring artifact - verified this session by scanning
# setup.dist 56/70/80/90/96/100/110/120/150/171/200/250 for LP hadouken vs a
# standing dummy): adv holds EXACTLY at ryu.json's Block_advantage=-9 at all
# 8 scanned dists 56-120 (the plateau boundary between 120 and 150 was not
# located; 121-149 unscanned), then drifts positive as dist grows
# further (adv=-3 at dist=150, +1 at 171, +8 at 200, +20 at 250 - later
# projectile contact eats into the window before the arcade table's assumed
# point-blank connect). `dist: close` (=56, this file's existing convention)
# sits well inside the exact-match plateau, so BLOCK entries assert
# expect.adv: from-qjson (Block_advantage="-9" in ryu.json, numeric, so
# from-qjson resolves cleanly - no hardcoded -9 needed). Confirmed
# strength-independent: LP/MP/HP all read adv=-9 at dist:close, S=10 R=36,
# in two separate runs (byte-identical).
#
# HIT entries omit expect.adv entirely: ryu.json's Hit_advantage for every
# Hadouken row is also the literal string "-" (same non-numeric-oracle-field
# reasoning as expect.A above) - from-qjson would raise CompileError, and no
# explicit value is asserted in its place (an omitted field is honest; the
# measured adv=-8 at dist:close, HIT, all three strengths, is recorded here
# only as a finding, never as a shipped expectation: the measured -8 vs the
# BLOCK row's point-blank -9 analogue is the same "one frame off the assumed
# point-blank" shape as the BLOCK-side plateau boundary, not investigated
# further - out of scope for Step 5, which only asserts what ryu.json gives
# numerically).
#
# WHIFF is explicitly NOT attempted here (plan P6): a hadouken travels
# full-screen and still connects with a standing dummy even at dist=250-300
# (verified during Steps 1-2's probe and reconfirmed this session at
# dist=250 BLOCK, which still connects, adv=+20) - the dummy cannot be
# scripted to jump or duck under it (G-directive AI only, not
# frame-scriptable), so there is no reachable WHIFF window for a fireball
# in this harness. Documented as a known gap, not a corpus entry.
#
# EX hadouken, Shinkuu/Denjin Hadouken, and any other special that spawns an
# effect WORK (shoryuken/tatsu) are out of scope for Step 5 (meter
# management / multi-hit supers unscoped; non-projectile specials are scope
# creep per the parent plan's Step 4/5 Do-Not lists) - not attempted, no
# entries below for them.

