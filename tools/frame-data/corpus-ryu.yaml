# Ryu frame-data corpus (Phase 6 Step 4, docs/plan-frame-data-harness.md
# Phase 6 charter + /tmp/phase6-nonq-plan.md Step 4). Generated/consumed by
# tools/frame-data/compile_corpus.py against docs/arcade-frame-data/ryu.json
# (fetched Step 3, md5 cd0f6c79b0735c46e3074f02fb2f5d51).
#
# Scope: Ryu normals (Step 4) PLUS Hadouken LP/MP/HP projectile entries
# (Step 5, exercising the arcade-split machinery from Steps 1-2 - see
# "Hadouken (projectile)" section below). Still NO shoryuken/tatsu/joudan/
# EX/super entries - those are scope creep beyond Step 5's charter (any
# non-hadouken move that spawns an effect WORK can extend this file later).
# Authored empirically against a live headless run per this repo's
# established discipline (see corpus-q.yaml) - every expect below was pinned
# by reading the actual trace, not guessed from ryu.json alone.
#
# Known harness limitations hit in this file (fireball WHIFF unreachable;
# hadouken block-adv plateau boundary 121-149 unscanned): see the
# consolidated "Harness limitations register",
# docs/frame-data-synthesis.md §12.1.
#
# MAJOR FINDING (2026-07-07, first run of this corpus): a systemic "A
# (active-frame count) undercounts on contact" divergence affects roughly
# half of Ryu's basic normals - Strong/Far Strong/Fierce/Far Fierce/Far
# Jab/Forward/Roundhouse/Crouching Forward/Towards+Fierce all show engine_a
# (the displayed A) measurably LOWER than ryu.json on BLOCK and HIT alike,
# while Jab/Short/Far Forward/Crouching Roundhouse/Towards+Strong/UOH (and
# EVERY WHIFF entry, for every button) match arcade exactly. This is NOT a
# corpus-authoring artifact:
#   - Verified independent of input timing: re-ran ryu-strong-block with
#     `hold MP 20` instead of the standard 2-frame `press` - identical
#     engine_a=2 result (vs arcade A=4).
#   - Verified independent of outcome: BLOCK and HIT entries for the same
#     move show the identical wrong A.
#   - Root-caused via direct [CM]/GT trace inspection: on the CONTACT
#     tick, the engine advances the attacker's cell chain a SECOND time
#     within the same Game_timer tick, in two shapes. (a) Skip-to-
#     recovery: Far Strong GT=136 contacts on cgix=8, same tick jumps to
#     recovery cgix=16 - the second declared active cell (cgix=12,
#     jatix=6, 3 frames, which plays in full on WHIFF at GT=230-232) is
#     never entered, so its credit never accrues (A=1 vs arcade 4). (b)
#     Same-jatix transit: Strong GT=43 credits cell 12 (jatix=4, ctr=2,
#     +2 frames), then same-tick advances to pat-consecutive cell 16
#     (same jatix=4), tripping the §13.7.4 same-tick jatix-gated revoke
#     which discards those 2 frames (A=2 vs arcade 4; without the revoke
#     this move reads 4 exact - jatix identity alone can't tell UOH's
#     phantom transit from a contact-collapsed cell arcade still
#     counts). Contrast: cr.HK's settle cell shares cghi/jatix with its
#     active cel but is entered on a LATER tick (GT=324->336, across
#     hitstop) - no same-tick advance, no revoke, A=5 exact. So it is
#     tick timing, not cghi/jatix sameness, that decides correct vs.
#     undercounted. WHIFF is always exact: no contact means no same-tick
#     branch at all.
#   - Scope correction: this is NOT "unlike Q." The identical same-tick
#     contact-advance fires for Q too (Q Strong BLOCK GT=50: cgix
#     30->36, same tick, see docs/frame-data-synthesis.md §13.7.4). Q's
#     corpus reads green only because Q's animation data gives each
#     transited cell a distinct jatix (5->6->7), so the §13.7.4 revoke
#     never fires and the continuation chain's remaining actives
#     (1+2+2=5) all get credited - an animation-data-dependent escape,
#     not proof the mechanism is Ryu-only. The finding is engine-wide.
#     Any future fix must NOT simply disable the §13.7.4 revoke - that
#     regresses q-uoh-samef-block/q-uoh-1f-block back to the documented
#     mutation FAIL (A=11).
# Per the Phase 6 plan's Step 4 guidance ("genuinely divergent entries:
# xfail + a finding note - this is an AUDIT, divergence is a result, not a
# blocker"), every affected entry below keeps its expect.A as the REAL
# arcade value (from-qjson) and is marked xfail with the measured wrong
# value - the wrong engine number is never substituted in as if it were
# now "expected".
#
# UPDATE (2026-07-07, §13.11 declared-truth displayed-A convention adopted -
# user decision on the issue #17 Step-1 escalation): the shape-(b) members
# above (Far Jab/Strong/Fierce/Far Fierce/Forward/Roundhouse-block+hit, plus
# Crouching Short - census-resolved this session as shape (b), see
# ryu-crlk-block's own comment) are RESOLVED, not xfail anymore. The §13.7.4
# revoke's subtraction is now immediately restored by a gated flag
# (charset.c fd_restore_revoked_declared_credit - mutation lever F), so
# these entries read their exact arcade A and are plain PASS. The shape-(a)
# members (Far Strong/Crouching Forward/Towards+Fierce - skip-jump (a1) and
# char_move-bypass (a2)) are a DIFFERENT mechanism: their declared active
# cells are never dispatched by any code at all, so there is no accumulator
# subtraction to restore - the credit is unrecoverable. They stay xfail
# (see each entry's own comment; synthesis §13.11 "what stays
# unrecoverable"). The closing instruction two paragraphs above is now
# SUPERSEDED: A=11 IS the §13.11 expect for q-uoh-samef-block/q-uoh-1f-block
# now, not a mutation-FAIL value - the revoke stays in the code with its
# subtraction cancelled by the gated restore (lever F), and disabling the
# revoke itself (lever A) is expected to change nothing (path-independence
# invariant; see docs/plan-frame-data-completion.md's E3 lever table).
#
# UPDATE (2026-07-10, §13.13): ryu-far-strong-block, ryu-crmk-block, and
# ryu-twdshp-block (the three shape-(a) members named above, "Far Strong/
# Crouching Forward/Towards+Fierce") convert to a plain PASS asserting the
# measured A citing §13.13 (see each entry's own comment) - the "They stay
# xfail" sentence above is superseded. Ryu now reads 37 PASS / 0 XFAIL.
