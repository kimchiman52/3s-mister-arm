oracle: hugo.json
inter_entry_wait: 250
sa_gauge: 3
entries:

- label: h-exgpb-whiff
  setup: { dist: 250, dummy: none }
  input: "hold DOWN 2; hold DOWN+LEFT 2; hold LEFT+LP+HP 2; wait 1"
  qjson: { name: "Giant Palm Bomber (EX)" }
  outcome: WHIFF
  # Measured S=22 A=3 R=10 — oracle-exact on all three fields (hugo.json
  # Giant Palm Bomber (EX): Startup=22, Hit=3, Recovery=10). The calibration
  # surface holds; only the contact legs below diverge (R+1 only).
  expect: { S: from-qjson, A: from-qjson, R: from-qjson }

- label: h-exgpb-block
  setup: { dist: close, dummy: stand }
  input: "hold DOWN 2; hold DOWN+LEFT 2; hold LEFT+LP+HP 2; wait 1"
  qjson: { name: "Giant Palm Bomber (EX)" }
  outcome: BLOCK
  # §12.2.2 R-surplus corollary (see file header) — R=11 asserted as measured
  # engine truth, by direct analogy to the converted Dudley Jet Uppercut (EX)
  # BLOCK R+1 / Q Dashing Leg Attack (EX) BLOCK R+1 precedents (same +1
  # magnitude). Arcade (whiff-canonical, from-qjson) R=10 — preserved in this
  # comment per the convention. S/A/adv all oracle-exact (S=22 A=3 adv=+10).
  expect: { S: from-qjson, A: from-qjson, R: 11, adv: from-qjson }

- label: h-exgpb-hit
  setup: { dist: close, dummy: none }
  input: "hold DOWN 2; hold DOWN+LEFT 2; hold LEFT+LP+HP 2; wait 60"
  qjson: { name: "Giant Palm Bomber (EX)" }
  outcome: HIT
  # Same §12.2.2 R-surplus corollary as h-exgpb-block above — R=11, identical
  # magnitude/shape on both outcomes (arcade R=10 preserved in that entry's
  # comment). A(3) == BLOCK leg's A(3) — juggle check (Ruling 2 item 3)
  # passes, S/A both oracle-exact. kd=1 measured (adv=+104, large, genuine
