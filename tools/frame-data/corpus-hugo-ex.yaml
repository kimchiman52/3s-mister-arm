# MOTION DISCOVERY (2026-07-12, this session — corpus-hugo.yaml's own base
# corpus does NOT contain Giant Palm Bomber or Monster Lariat at any strength,
# so there is no in-repo base-move precedent for either family's real motion;
# unlike every other wave-5/6 EX satellite, this was a from-scratch discovery,
# not a "reuse the base move's own confirmed motion" job).
#
# Real-arcade documentation (EventHubs/SuperCombo Wiki convention) calls both
# families CHARGE moves ("charge-back, forward + P" / "charge-back, forward +
# K"). That documented shape was tried FIRST and FAILED decisively: `motion
# charge-back 45 then-forward LP` (matching corpus-q.yaml's own working 45f
# charge precedent and corpus-remy.yaml's 60f precedent) landed plain Jab
# (S=4 A=4 R=8, exact match to hugo.json's OWN "Jab" row) instead of Giant Palm
# Bomber (Jab) (oracle S=17 A=2 R=9); `motion charge-back 45 then-forward LK`
# landed plain Short (S=5 A=4 R=9, exact) instead of Monster Lariat (Short)
# (oracle S=11 A=5). Re-tried at charge-back 100 frames (2.2x the working Q/
# Remy value) for the EX chord specifically - byte-IDENTICAL wrong result
# (S=14 A=4 R=33, exactly hugo.json's "Towards + Fierce" row) at BOTH 45 and
# 100 frames, proving charge duration is not the variable: the charge-back-
# then-forward shape simply does not drive these two Hugo moves in this
# engine's implementation, contrary to real-arcade documentation. (The
# byte-identical wrong result at two different charge durations is itself the
# tell: a "Towards + X" command-normal dispatch is duration-independent by
# construction - forward+button off ANY non-forward stance - which is exactly
# what fired both times, meaning the charge FSM was never actually reached.)
#
# Per this program's own established discovery method (CORPUS-AUTHORING.md
# Phase 5 "motion-probe method": try existing macros first, S-value match
# against the oracle is ground truth), the four remaining already-expressible
# `motion` macros were batch-probed against hugo.json's OWN Giant Palm Bomber
# (Jab)/Monster Lariat (Short) rows (not the EX rows yet, to keep the S-match
# signal clean against a single, non-range Startup value each):
#   - Giant Palm Bomber (Jab): qcf FAILS (lands plain Jab, same wrong-move
#     signature as the failed charge attempt); qcb PASSES (S=17 A=2 R=9,
#     exact); hcb PASSES (S=17 A=2 R=9, exact - hcb's path subsumes qcb's
#     final quarter, consistent with this engine's documented partial-circle
#     input leniency, corpus-hugo.yaml's own 360-grab precedent); hcf FAILS
#     (same wrong-move signature).
#   - Monster Lariat (Short): qcf PASSES (S=11 A=5 R=21, R=21 is the FLOOR of
#     hugo.json's own range "21 ~ 25" for this row - same range-floor shape as
#     Meat Squasher, see corpus-hugo.yaml's own Meat Squasher section); qcb
#     FAILS (wrong-move signature); hcb FAILS (wrong-move signature, a THIRD
#     distinct wrong move this time - S=7 A=2 R=36, matching none of Hugo's
#     six-button normals directly, not investigated further since hcb is not
#     the shipped recipe); hcf PASSES (S=11 A=5 R=21, exact - hcf's path
#     subsumes qcf's final quarter, same leniency as GPB's qcb/hcb pair).
# CONCLUSION: Giant Palm Bomber = qcb (quarter-circle back) + P; Monster
# Lariat = qcf (quarter-circle forward) + K. NOT charge moves in this engine's
# implementation, despite real-arcade documentation calling them charge - the
# established methodology (S-value match against the oracle, not memory of
# real-game notation) is exactly what caught this; corroborated at qcb PASSES
# / hcb PASSES for GPB and qcf/hcf for ML (the redundant-macro cross-check the
# `motion` probe naturally provides). `motion` requires a single button, so
# the EX chord below is a hand-expanded hold-chain of the SAME qcb/qcf shape
# (`_motion_steps`, compile_corpus.py:256-275), chording the final step with
# two same-type buttons per the wave-1..6 EX-pilot convention (punch moves get
# LP+HP, kick moves get LK+HK) - confirmed landing the correct EX move on the
# FIRST chorded attempt (S-value match against hugo.json's own EX rows: S=22/
# S=6 respectively, each distinct from its own base-move Jab/Short S=17/11,
# confirming genuine EX dispatch, not a plain-strength fallback):
#   - Giant Palm Bomber (EX), chord LP+HP: `hold DOWN 2; hold DOWN+LEFT 2;
#     hold LEFT+LP+HP 2; wait 1`
#   - Monster Lariat (EX), chord LK+HK: `hold DOWN 2; hold DOWN+RIGHT 2; hold
#     RIGHT+LK+HK 2; wait 1`
#
# sa_gauge: 3 (MAXIMUM, per authoring-policy.md's meter policy — EX moves are
# meter-metered, 1 stock/activation; training mode's default starting gauge is
# not guaranteed full, the Ryu EX pilot's own load-bearing finding).
#
# inter_entry_wait: 250 (matching the wave-1..6 settled value). Single-FINAL
# integrity confirmed directly against every probe trace this session (exactly
