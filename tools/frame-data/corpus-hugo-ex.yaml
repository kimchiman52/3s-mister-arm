# R+1 and Q Dashing Leg Attack (EX) BLOCK R+1
# (`<sp>/exsuper/excontact-r-findings.md` §1.4 / `<sp>/exsuper/q-ex-report.md`
# "Dashing Leg Attack (EX)" section) - same +1 magnitude, same "contact-branch
# content insertion" mechanism by direct analogy. Not independently re-traced
# per-tick cell-by-cell this session (budget); rundir preserved at
# `<sp>/ex-hugo/run6/trace.log` (BLOCK F=56 FINAL, HIT F=207 FINAL) if a
# stronger per-tick citation is wanted later. A is oracle-exact on all three
# legs (S=22 A=3 everywhere) - no undercount/overcount on this field at all,
# unlike Monster Lariat below. HIT kd=1 measured (adv=+104, large, genuine
# knockdown); hugo.json's own Hit_advantage is the literal "-" for this row
# (same as every other Hugo special whose Cancel.Super_art=true - a launcher-
# class move with no fixed hit advantage), so adv stays unasserted on HIT.
