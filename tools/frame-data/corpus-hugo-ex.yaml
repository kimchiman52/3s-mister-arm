# ============================================================================
# GIANT PALM BOMBER (EX) — §12.2.2 R-surplus corollary (BLOCK+HIT, both legs
# identical +1). WHIFF is oracle-exact on all three fields (S=22 A=3 R=10,
# `<sp>/ex-hugo/run5/trace.log` F=37 FINAL). BLOCK and HIT both measure R=11
