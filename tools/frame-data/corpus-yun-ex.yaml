# Yun EX moves corpus -- EX/Supers program, wave 2 fan-out (Ruling 5's
# per-character EX satellite batches, <sp>/exsuper/authoring-policy.md).
# Satellite corpus (auto-discovered by run-suite.sh's corpus-*.yaml glob, own
# golden/yun-ex.tsv) -- the main corpus-yun.yaml is untouched.
#
# Scope: Yun's 3 ground EX rows per <sp>/exsuper/step0-universe.tsv (rows
# 142-144): Tetsu Zankou (EX), Zesshou Hohou (EX), Nishou Kyaku (EX). Yun has
# NO air-variant EX row in step0-universe (unlike Ryu/Ken/Alex/etc.) -- all
# three of his EX rows are ASSERTABLE, in scope. Oracle:
# docs/arcade-frame-data/yun.json (md5 cc49322b0fcd04e617f22b0410a658fa, same
# file corpus-yun.yaml already pins -- re-verified unchanged this session).
# All three EX rows carry the parenthesized "(EX)" suffix in yun.json's own
# `Name` field (Ryu-oracle convention, not Ken's bare-string one) -- verified
# live this session, per CORPUS-AUTHORING.md Phase 1's "always open the
# fetched oracle and read the exact string" rule.
#
# Motion recipes (Phase 5 motion-probe method, re-using corpus-yun.yaml's own
# base-move macros with the final step's button chorded to LP+HP / LK+HK --
# same 2-button-chord workaround the Ryu/Ken EX pilots used, since
# cmd_motion only accepts a single button token and 'hold's chord parser
# takes '+'-joined tokens):
#   - Tetsu Zankou (EX) (shoulder, DP-shape hold-chain -- same base-move
#     primitive as corpus-yun.yaml's own `yun-tetsu-*` entries, Ken
#     Shoryuken / Hugo Shootdown Backbreaker precedent): `hold RIGHT 2; hold
#     DOWN 2; hold DOWN+RIGHT 2; hold RIGHT+LP+HP 2; wait 1`. Landed on the
#     FIRST attempt (S=10 matches yun.json's Tetsu Zankou (EX) row exactly,
#     unambiguous -- distinct from every other Tetsu Zankou/Zesshou
#     Hohou/Nishou Kyaku strength's own S value).
#   - Zesshou Hohou (EX) (lunge punch, qcf-shape -- corpus-yun.yaml's own
#     base move uses the plain unchorded `motion qcf <btn>` macro, but
#     `cmd_motion` rejects a '+'-joined button token, so this entry
#     reproduces qcf's own _motion_steps sequence by hand with the final
#     step chorded, identical workaround to Ryu/Ken's EX Hadouken): `hold
#     DOWN 2; hold DOWN+RIGHT 2; hold RIGHT+LP+HP 2; wait 1`. Landed on the
#     FIRST attempt (S=13 matches yun.json's Zesshou Hohou (EX) row exactly
#     -- same S as the base move's own Fierce strength, an expected shared
#     signature since qjson: { name: "Zesshou Hohou (EX)" } disambiguates
#     unambiguously by name regardless).
#   - Nishou Kyaku (EX) (upkicks, DP-shape hold-chain -- same primitive as
#     corpus-yun.yaml's own `yun-nishou-*` entries): `hold RIGHT 2; hold
#     DOWN 2; hold DOWN+RIGHT 2; hold RIGHT+LK+HK 2; wait 1`. Landed on the
#     FIRST attempt (S=4 matches yun.json's Nishou Kyaku (EX) row exactly).
#
# dist_mode: centered (EX/Supers tooling micro-batch) used on Tetsu Zankou
# (EX)'s whiff binary-search probes only (both attempts still connected --
# see that section's own WHIFF-UNREACHABLE note); Nishou Kyaku (EX)'s WHIFF
# leg reuses corpus-yun.yaml's own base-move anchored dist=300 recipe
# unchanged (already proven reachable there).
#
# ORDERING NOTE (§12.1 row 2 "teleport clamps / momentum bleed after
# connecting dash specials", corpus-q.yaml/corpus-yun.yaml precedent): a
# first-draft probe placed each move's own WHIFF entry AFTER its own
# connecting HIT entry (and, separately, after a PRIOR move's connecting HIT
# entry) -- both placements read a badly clamped MOVE_START separation
# (dist=71 requested 150; dist=92/94 requested 250/280) and produced a false
# HIT-shaped read that looked like a genuine reach problem at first. Isolated
# single/first-entry re-verification (Phase 5 discipline) confirmed the TRUE
# reachability picture used below: Tetsu Zankou (EX) and Zesshou Hohou (EX)
# are genuinely WHIFF-UNREACHABLE even as each move's own corpus's FIRST
# entry (zero preceding contamination possible) at dist=280-305px centered
# -- a real move-reach fact, not an ordering artifact. Nishou Kyaku (EX)'s
# WHIFF leg is placed ahead of its own BLOCK/HIT legs in the final corpus
# below, matching corpus-yun.yaml's own base-move ordering discipline.
#
# Admissibility census (per-entry, mechanical, from FRAME_TRACE columns --
# authoring-policy.md Ruling 2), all 7 shipped entries below:
# (1) Single-FINAL integrity: exactly one FINAL per entry's own window, no
#     label-bleed, at inter_entry_wait:250 -- confirmed by direct inspection
#     of the final corpus's own trace (7 MOVE_START/FINAL pairs, cleanly
#     alternating, one per entry, zero merges).
# (2) Flash-overlap census (sastop gate): 0 nonzero sastop ticks across the
#     ENTIRE trace (mechanical awk census over every data row, not sampled)
#     -- EX moves are flash-free, confirmed mechanically, not assumed.
# (3) Contact-A juggle check (HIT-leg A admissible only if it equals the
#     BLOCK-leg's A): Tetsu Zankou (EX) (13==13) and Nishou Kyaku (EX)
#     (6==6, non-numeric-adv on WHIFF/HIT doesn't affect the check) BOTH
#     PASS. Zesshou Hohou (EX)'s A is a documented UNCLASSIFIED divergence
#     on BOTH legs (measured 16==16, matching BETWEEN the two legs, but NOT
#     matching the oracle on either) -- the juggle check itself passes
#     (HIT A equals BLOCK A), it is the oracle comparison that diverges; see
#     that section's own xfail string.
# (4) Shape record: Tetsu Zankou (EX) is single-run (box_runs=1, both
#     contact legs); Zesshou Hohou (EX) is single-run (box_runs=1, both
#     contact legs, proj=0 -- a melee lunge, not a projectile, despite the
#     qcf-shape motion); Nishou Kyaku (EX) is GENUINELY multi-run on its
#     WHIFF/BLOCK legs (box_runs=2 -- the double-kick move's second hit
#     registering as its own box run) but single-run on HIT (box_runs=1) --
#     the Ruling 3 shape (same class as Ken SA3 / Ryu's own EX Tatsumaki /
#     Ken's own EX Tatsumaki), but like Ken's EX Tatsumaki, WITH ZERO
#     divergence: every field is oracle-exact on all three legs regardless
#     of box_runs, so multi-run alone does not by itself license a
#     quarantine here.
#
# RESULT: Tetsu Zankou (EX) and Nishou Kyaku (EX) are fully oracle-exact on
# every asserted field, every leg -- ZERO divergences. Zesshou Hohou (EX)
# carries ONE UNCLASSIFIED finding (A/R sum-preserving boundary shift,
# identical measured signature to corpus-yun.yaml's own base-move Zesshou
# Hohou (Fierce) UNCLASSIFIED entry) on both its BLOCK and HIT legs -- NOT a
# program quarantine (Ruling 3's quarantine machinery is for multi-run
# supers; this is a Phase-6-style contact divergence with no confirmed
# bucket, so it ships xfail per the house "wrong values never ship as if
# correct" rule, exactly like its base-move sibling). Two WHIFF-UNREACHABLE
# moves (Tetsu Zankou (EX), Zesshou Hohou (EX)), one clean WHIFF (Nishou
# Kyaku (EX)).
character: yun
oracle: yun.json
inter_entry_wait: 250
# sa_gauge: MAXIMUM (3) per authoring-policy.md's meter policy -- EX moves
# are meter-metered (1 stock/activation, G3) and training mode's default
# starting gauge is not guaranteed full/nonzero (the Ryu EX pilot's own
# finding, re-confirmed this session: a corpus with no sa_gauge key landed
# the plain-strength fallback instead of the EX move on the first attempt).
# MAXIMUM (not INFINITY) per policy default for ordinary (non-install) EX
# moves.
sa_gauge: 3
entries:

# --- Tetsu Zankou (EX) (shoulder, DP-shape hold-chain) ----------------------
# WHIFF-UNREACHABLE(dist=310 requested / 305 achieved at MOVE_START --
# CENTERED_DIST_MAX's practical ceiling). Binary search, each attempt
# isolated (this move's own corpus's FIRST entry, zero preceding
# contamination): dist=280 centered achieved a clean 275px separation and
# STILL connected (outcome HIT); dist=310 centered (the hard cap) achieved
# 305px and ALSO connected (S=10 A=13 R=19 adv=+85, a clean single-run HIT --
# box_runs=1, not a shape/census problem). Root cause: Tetsu Zankou (EX)'s
# own forward-lunging shoulder charge simply covers the ENTIRE centered
# ceiling and connects -- a pure move-reach fact (same shape as Ken's EX
# Tatsumaki / Yun's own base-move Zesshou Hohou (Fierce)/Tetsu Zankou
# (Fierce) SPECIALS-REACHABILITY GAP), not a harness placement/ordering
# artifact (both isolated reads showed clean, near-full achieved
# separation). No further binary search attempted (310 is the hard
# compile-time cap for dist_mode:centered; nothing higher is scriptable).
# Coverage for this move's WHIFF path is out of reach in this harness;
# coverage instead comes from the BLOCK/HIT legs below (both fully
# oracle-exact on S/A/R/adv), per Ruling 1 ("its coverage comes from Ruling
# 2's contact legs + S"). Census: single-FINAL, sastop=0, box_runs=1,
# proj=0 (both legs).

- label: yun-extetsu-block
  setup: { dist: close, dummy: stand }
  input: "hold RIGHT 2; hold DOWN 2; hold DOWN+RIGHT 2; hold RIGHT+LP+HP 2; wait 1"
  qjson: { name: "Tetsu Zankou (EX)" }
  outcome: BLOCK
  # Measured S=10 A=13 R=19 adv=-7 (box_runs=1, proj=0), oracle-exact on all
  # four fields (yun.json Tetsu Zankou (EX): Startup=10, Hit=13,
  # Recovery=19, Block_advantage=-7). BLOCK-leg A needs no juggle check
  # (Ruling 2: it IS the validated legacy instrument) -- logged here as the
  # cross-check anchor for the HIT leg below.
  expect: { S: from-qjson, A: from-qjson, R: from-qjson, adv: from-qjson }

- label: yun-extetsu-hit
  setup: { dist: close, dummy: none }
  input: "hold RIGHT 2; hold DOWN 2; hold DOWN+RIGHT 2; hold RIGHT+LP+HP 2; wait 1"
  qjson: { name: "Tetsu Zankou (EX)" }
  outcome: HIT
  # Measured S=10 A=13 R=19 -- HIT-leg A (13) equals the BLOCK-leg's
  # displayed A (13), so the juggle check (Ruling 2 check 3) passes and A is
  # admissible here. No expect.adv (Hit_advantage is the literal string "-"
  # for this row in yun.json, same as every other Tetsu Zankou strength).
  expect: { S: from-qjson, A: from-qjson, R: from-qjson }

