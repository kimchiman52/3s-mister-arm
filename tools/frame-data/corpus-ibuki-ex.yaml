# --- Kubiori (EX), motion hcf + P (chord LP+HP) -----------------------------
# Two-phase move, SAME structural shape as mains' own base Kubiori (grab-
# family precedent applied per task direction): the oracle's single
# published row (Startup=15, Hit=10, Recovery=19, Block_advantage=-27)
# describes an initial blockable STRIKE phase; the dummy:none catch-and-throw
# phase is a distinct signature the oracle does not separately publish (same
# hypothesis as mains' own Kubiori section).
#
# WHIFF-UNREACHABLE(dist=310 centered / dist=300 anchored / dist=250
# anchored, all tried, all connect) — binary search confirmed EX Kubiori's
# own hcf dash-in convergence reaches EVERY distance this harness can
# script, unlike the base (non-EX) Kubiori (whose own WHIFF entry cleanly
# misses at dist:250, per mains). The EX version's forward lunge evidently
# covers materially more ground than the base version — a genuine EX-move
# property difference, not a harness artifact (same class of finding as Ken
# EX Tatsumaki's own WHIFF-UNREACHABLE: "the move's own... reach... covers
# the ENTIRE centered ceiling and still connects"). No WHIFF leg shipped;
# coverage comes from the BLOCK/HIT legs below, per Ruling 1.

- label: ibuki-exkubiori-block
  setup: { dist: 40, dummy: stand }
  input: "hold LEFT 2; hold LEFT+DOWN 2; hold DOWN 2; hold DOWN+RIGHT 2; hold RIGHT+LP+HP 2; wait 1"
  qjson: { name: "Kubiori (EX)" }
  outcome: BLOCK
  # Measured S=15 A=10 (box_runs=0, cut=1, anchor_a=10 matching engine_a=10)
  # — S/A both oracle-exact (ibuki.json Kubiori (EX): Startup=15, Hit=10).
  # R (measured 10) and adv (measured -6) both diverge from the oracle
  # (Recovery=19, Block_advantage=-27) — the SAME item-18(b) whiff-R-
  # truncation shape mains' own Kubiori disposition already established
  # (cut=1/anchor-match signature identical to ibuki-kubiori-lp-block/-whiff)
  # and the SAME census-adjudicated lever-N/O exclusion (§13.17 RE-ANCHOR-1:
  # box_count=0 throughout this window, all four att_box slots zero — the
  # pre-existing box_count>0 gate correctly excludes it). Per this program's
  # own quarantine convention (authoring-policy.md Ruling 3: unexplained
  # divergences omitted from the corpus, logged in the report, not shipped as
  # an xfail-with-string the way the mains corpus does for this same family)
  # R and adv are OMITTED here rather than xfailed — the mechanism is
  # identified (item 18(b), the same one mains already names), so this is a
  # documented omission, not a fresh unexplained quarantine.
  expect: { S: from-qjson, A: from-qjson }

- label: ibuki-exkubiori-hit
  setup: { dist: 40, dummy: none }
  input: "hold LEFT 2; hold LEFT+DOWN 2; hold DOWN 2; hold DOWN+RIGHT 2; hold RIGHT+LP+HP 2; wait 1; wait 90"
  qjson: { name: "Kubiori (EX)" }
  outcome: HIT
  # FIELD-MASKED (same posture as mains' ibuki-kubiori-lp-hit): measured
  # S=15 A=2 R=40 adv=+145 kd=1 (box_runs=0, cut=0, endrel=1 — the genuine
  # post-capture end mechanism, same as ibuki-throw-hit/ibuki-raida-lp-hit/
  # mains' own Kubiori catch phase). A/R/adv are NOT comparable against
  # ibuki.json's published row (that row describes the strike/setup phase
  # the BLOCK leg above measures, not this catch-and-throw phase) — same
  # two-phase-move structural finding mains already established, now
  # reproduced identically on the EX row. S=15 (shared by both phases,
  # oracle-exact) and kd=1 (explicit, engine-measured) are the only
  # comparable/assertable fields.
  expect: { S: from-qjson, kd: 1 }

