# across moves). Retimed 2026-07-06 to land the second press (LP) inside
# the dummy's actual blockstun window, read directly from this move's own
# trace: P2.r1 (dummy) is 1 from local F=7 through F=28 inclusive,
# returning to 0 at F=29. `wait 10` puts the LP press at local F=13-14,
# comfortably inside that window (checked wait=5/7/10/14/20/24 - all land
# inside F=7-28 and give an identical result). Result: still NO merge, and
# in fact no effect at all - P1.r1/P2.r1 timelines and the FINAL's
# S/A/R/finals-count are byte-identical to plain cr.MK with no second
# press whatsoever, for every wait value tried. Root cause: cr.MK's own
# r1=4 state runs until its own Recovery elapses (S=7+A=3+R=14=24,
# attacker idle at local F=32) - a full 3 frames AFTER the dummy already
# exits blockstun (F=29, consistent with cr.MK's -3 block advantage), so
# there is no "attacker already idle, dummy still blockstunned" window for
