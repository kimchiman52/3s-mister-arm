# Q under ARCADE (CPS3) balance -- task #108.
#
# WHAT THIS IS
# ------------
# corpus-q.yaml, re-measured against the engine that actually SHIPS. Arcade
# balance auto-selects the moment a CPS3 romset verifies
# (src/arcade/arcade_balance.c), which is confirmed on hardware; every one of
# the 94 pre-#108 corpora, this one's PS2 twin included, runs the PORT tables
# instead, because run.sh passed --test-enable and arcade_balance.c pinned PS2
# for any test-runner process. `balance: arcade` below is what makes this run
# the shipping engine, and it is a HARD requirement: without a verified romset
# the run exits 6 rather than quietly re-measuring PS2 and reporting green.
#
# PROVENANCE OF EVERY ENTRY
# -------------------------
# Each entry below is copied VERBATIM -- comments and all -- from
# corpus-q.yaml, so the authoring rationale, oracle pinning, distance probes
# and harness-limitation notes that justify each expectation are the same text
# that justifies them on the PS2 side. Nothing here was re-derived by
# measuring arcade and writing down what came out; the expectations are the
# PS2 corpus's, and the question this corpus asks is whether the shipping
# engine agrees with them.
#
# It mostly does. Measured this session, 51 entries: 49 PASS, 2 XFAIL.
#
# WHAT WAS LEFT OUT, AND WHY
# --------------------------
# All 22 of corpus-q.yaml's `outcome: BLOCK` entries are omitted. Under arcade
# balance the port's check_illegal_lever_data() lever normalization is skipped
# (src/sf33rd/Source/Game/engine/plmain.c:52-55), and a dummy that BLOCKs
# under PS2 was observed to take the HIT instead -- reproduced on
# corpus-smoke.yaml's own `close-lp-block-vs-stand`, which reads
# `outcome=BLOCK` on PS2 and `outcome=HIT` on arcade with every numeric field
# unchanged. That is a training-dummy behaviour divergence, not a frame-data
# one, and it is not yet understood; per CORPUS-AUTHORING.md Phase 6 an
# unexplained divergence is a STOP, not something to paper over with 22
# xfails. So arcade BLOCK coverage is NOT claimed here. Omitted labels:
#
#   q-far-jab-block, q-jab-block, q-strong-block
#   q-fierce-block, q-short-block, q-forward-block
#   q-far-forward-block, q-roundhouse-block, q-crlk-block
#   q-crmk-block, q-crhk-block, q-crhp-block
#   q-backhp-block, q-backhk-block, q-dla-rh-block
#   q-hsb-jab-block, q-hsb-strong-block, q-hsb-fierce-block
#   q-uoh-samef-block, q-uoh-1f-block, q-uoh-chain-retrigger
#   q-crmk-multimove-merge
#
# The two XFAILs are marked inline at their entries (q-crmp-hit-capture-a/b).
#
# `inter_entry_wait: 90` and `oracle: q.json` are corpus-q.yaml's own values,
# unchanged.
character: q
oracle: q.json
balance: arcade
inter_entry_wait: 90
