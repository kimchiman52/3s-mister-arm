# cr.LK vs. a guarding dummy - issue #14, SHIPPED 2026-07-07. Was: never
# registered BLOCK (fell through to WHIFF) regardless of dummy stance/
# distance/pre-crouch timing. Root cause: on contact, P2.dm_stop (frame_trace.c
# column P2.dstop) transitions 0 -> +7 (positive) - a genuine block exchange
# (P1/P2 both take real hitstop) - but the old event-edge predicate required
# `dn->dm_stop < 0`, so a *positive* dm_stop transition was silently dropped.
# dm_stop = att.hs_you (hitcheck.c dm_status_copy, hit :544 and guard :603
# paths alike); hs_you is a signed s8 per-move data byte (structs.h:115) whose
# sign selects hitstop *style* (positive = frozen, negative = animation
# advances during the stop - plmain.c check_hit_stop), not the event kind.
# Q/Ryu cr.LK carry hs_you=+7; their cr.MK/cr.HK carry -9/-11. Fix: widened
# frame_data_overlay.c's event-edge predicate to `dn->dm_stop != 0`
# (frame_data_overlay.c ~line 929) - no non-contact engine code writes
# dm_stop, so the widened edge is contact-only in both signs; parries
# (always -15) are unaffected.
- label: q-crlk-block
  setup: { dist: close, dummy: crouch }
  input: "press DOWN+LK"
  qjson: { name: "Crouching Short" }
  outcome: BLOCK
  expect: { S: from-qjson, A: from-qjson, R: from-qjson, adv: from-qjson }

- label: q-crmk-block
  setup: { dist: close, dummy: crouch }
  input: "press DOWN+MK"
