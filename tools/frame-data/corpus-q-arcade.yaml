# Q under ARCADE (CPS3) balance -- task #108, completed by task #136.
#
# WHAT THIS IS
# ------------
# corpus-q.yaml, re-measured against the engine that actually SHIPS. Arcade
# balance auto-selects the moment a CPS3 romset verifies
# (src/arcade/arcade_balance.c), which is confirmed on hardware; every one of
# the 94 pre-#108 corpora, this one's PS2 twin included, runs the PORT tables
# instead, because run.sh passed --test-enable and arcade_balance.c pinned PS2
# for any test-runner process. `balance: arcade` below is what makes this run
# the shipping engine, and it is a HARD requirement: without a verified romset
# the run exits 6 rather than quietly re-measuring PS2 and reporting green.
#
# PROVENANCE OF EVERY ENTRY
# -------------------------
# Each entry below is copied VERBATIM -- comments and all -- from
# corpus-q.yaml, so the authoring rationale, oracle pinning, distance probes
# and harness-limitation notes that justify each expectation are the same text
# that justifies them on the PS2 side. Nothing here was re-derived by
# measuring arcade and writing down what came out; the expectations are the
# PS2 corpus's, and the question this corpus asks is whether the shipping
# engine agrees with them.
#
# It does, on all 73 of them. Measured 2026-08-30: 73 PASS, 0 XFAIL, and the
# parsed table is row-for-row identical in content to tools/frame-data/
# golden/q.tsv -- same outcome, same S/A/R/adv/kd on every label.
#
# THE THREE DELIBERATE DEVIATIONS FROM corpus-q.yaml
# --------------------------------------------------
# All three are marked inline at their entries. None of them touches an
# `expect:` field; two change a `setup.dummy`, one changes entry ORDER.
#
#  1/2. `q-dla-rh-block` and `q-crmk-multimove-merge` say `dummy: crouch`
#       where corpus-q.yaml says `dummy: stand`. Both attacks are LOWS, and
#       arcade requires the dummy to actually be crouching to block a low
#       where the PS2 port does not. This is a REAL engine difference, not a
#       harness workaround -- see the note at entry 1 for the code.
#
#    3. `q-crmk-multimove-merge` is moved to sit AFTER the two
#       `q-crmp-hit-capture-*` entries instead of before them, because a
#       `dummy: crouch` entry leaves the dummy crouching into the FIRST entry
#       that follows it. That carryover is balance-INDEPENDENT (measured on
#       both engines, see the note at that entry); it only becomes visible
#       here because deviation 2 introduced a crouch entry the PS2 ordering
#       never had.
#
# WHAT MAKES THE BLOCK ENTRIES RUN AT ALL (history)
# -------------------------------------------------
# This corpus originally shipped with all 22 of corpus-q.yaml's `outcome:
# BLOCK` entries OMITTED, because a `dummy: stand` entry that BLOCKs under PS2
# was observed to HIT under arcade and the cause was not isolated. It is now:
# the training ALL-GUARD DIP only makes the dummy block through PS2's `ags`
# term (hitcheck.c:1365-1366/:1496), which defense_ground_cps3() does not
# have. The harness now sets the dummy's `auto_guard` -- the field CPS3's own
# defense path provides for exactly this -- in src/test/input_script.c's
# input_script_apply_guard_mode(), which carries the full derivation. All 22
# BLOCK entries are restored below and all 22 pass.
#
# WHAT MAKES q-crmp-hit-capture-a/b PASS (history)
# ------------------------------------------------
# Those two carried an ARCADE-VS-PORT-DIVERGENCE xfail for measuring adv=-2
# against an oracle of -1. Cause: arcade skips check_omop_vital()
# (plmain.c:335-337), so the training dummy is never healed and reaches 0
# vitality partway through a 73-entry corpus, at which point same_dm_stop()'s
# nearly-dead branch (hitcheck.c:1023-1039) shortens the defender hitstop by
# one frame. att.dipsw/hs_me/hs_you are IDENTICAL across the two engines
# there. The harness now restores the dummy's vitality at each entry
# (input_script_restore_vitality(), src/test/input_script.c), and both entries
# read the oracle's -1. Not an engine divergence -- a dead dummy.
#
# `inter_entry_wait: 90` and `oracle: q.json` are corpus-q.yaml's own values,
# unchanged.
