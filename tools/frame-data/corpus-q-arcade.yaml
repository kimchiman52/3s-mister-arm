# value - this entry pinned A equality with the BLOCK/HIT entries above.
# §13.17 AMENDMENT (2026-07-11, rule adopted 2026-07-11: "whiff active-
# frames come from the raw hitbox count" — user grant, docs/plan-
# frame-data-completion.md OVERLAY RE-ANCHOR §6.2): A: 11 -> 10. Lever O
