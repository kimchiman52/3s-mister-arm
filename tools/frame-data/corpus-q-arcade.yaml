# HIT: R=3 instead of the 5 that matches both q.json and the BLOCK entries
# above. This is not an unexplained gap - §13.7.3 ("HIT R=3 vs BLOCK R=5")
# documents the exact mechanism: the §13.5.1 cleanup-anim cut window runs
# ~4 ticks shorter on HIT than on BLOCK, because the dummy's hitstun ends
