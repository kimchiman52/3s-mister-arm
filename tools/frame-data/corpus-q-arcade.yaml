# ARCADE DEVIATION 1 of 3 (task #136): corpus-q.yaml says `dummy: stand` here.
# Dashing Leg Attack is a LOW (its att.guard & 0x18 selects case 8), and
# defense_ground_cps3() requires the crouch bit to be held to guard a low --
# `case 8: if (!(ds->cp->sw_lvbt & 2)) return 2;`, hitcheck.c:1320-1321.
# defense_ground_ps2()'s same case carries an `&& ags == 0` escape
# (hitcheck.c:1508) which lets a STANDING training ALL-GUARD dummy block a low,
# so the PS2 twin never had to say `crouch`. Measured verbatim-with-`stand`
# under arcade: outcome=HIT, adv=+35, kd=1 instead of BLOCK adv=-15. The
# numbers below are unchanged from corpus-q.yaml and are met exactly once the
# dummy actually crouches.
# DLA RH BLOCK: new Step 5 diagnosis anchor entry (2026-07-07,
# docs/frame-data-synthesis.md §13.10) - first-ever clean BLOCK capture
# for this move (also a third always-connecting entry alongside Fierce
# Head/RH Leg's HIT variants below, per the ORDERING NOTE above - a
# corrupted P1 teleport from the preceding entry cannot break this one
# since DLA RH connects at any distance up to DIST_MAX=300 regardless of
# outcome). Matches q.json exactly on all four fields (31/2/31, adv -15,
# zero residual) - anchors §13.10 Class 1's claim that the block/whiff
# chain is arcade-exact for every strike-subfamily member; only the HIT
# path plays a different (shorter) hit-branch recovery chain.
- label: q-dla-rh-block
  setup: { dist: 300, dummy: crouch }
  input: "motion charge-back 45 then-forward HK; wait 100"
  qjson: { name: "Dashing Leg Attack (RH)" }
  outcome: BLOCK
  expect: { S: from-qjson, A: from-qjson, R: from-qjson, adv: from-qjson }

# RH's dash travels far enough to connect even at DIST_MAX=300 (same
# situation as Dashing Head Fierce above) - HIT entry instead of WHIFF.
# R=24 on HIT vs q.json's documented 31 (the whiff/block-range figure,
# now also directly captured above by q-dla-rh-block) is the §13.10
# HIT-R display convention (Class 1, hit-branch recovery chain): the
# engine plays a genuinely shorter parallel recovery chain on HIT,
# converging on the same terminal cell as BLOCK - not a defect, see
# docs/frame-data-synthesis.md §13.10 for the full tick-table proof.
# Defender is knocked down on hit (kd=1, P2 r2=16 buttobi), so a
# hitstun-vs-blockstun differential (§13.7.3's UOH mechanism) cannot
# even be formed here - this is a distinct mechanism from UOH's.
- label: q-dla-rh-hit
  setup: { dist: 300, dummy: none }
  input: "motion charge-back 45 then-forward HK; wait 100"
  qjson: { name: "Dashing Leg Attack (RH)" }
  outcome: HIT
  expect: { S: from-qjson, A: from-qjson, R: 24 }

