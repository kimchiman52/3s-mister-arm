# section 1.8 item 5), A/R read 0.
- label: q-taunt
  setup: { dist: 250, dummy: none }
  input: "press HP+HK"
  outcome: WHIFF
  expect: { S: 62, A: 0, R: 0 }

# Throw (LP+LK) WHIFF: new Step 5 diagnosis anchor entry (2026-07-07,
# docs/frame-data-synthesis.md §13.10) - proves §13.10 Class 3's claim
# that arcade "Recovery" for a connected grab is the whiff-path figure.
# Matches q.json exactly on all three fields (2/1/21).
- label: q-throw-whiff
  setup: { dist: 250, dummy: none }
  input: "press LP+LK"
  qjson: { name: "Throw" }
  outcome: WHIFF
  expect: { S: from-qjson, A: from-qjson, R: from-qjson }

# Throw (LP+LK). Genuinely connects at throw range (dist 20-28 all
# identical) - not the "nothing happens" case despite being a negative
# control. S/A match q.json's Throw entry exactly; R=34 vs q.json's
# documented 21 (the whiff-path figure, now also directly captured above
# by q-throw-whiff) is the §13.10 HIT-R display convention (Class 3,
# connected grab): on HIT the grab connects and the overlay measures the
# real post-capture throw sequence instead, bounded by the §13.5.1 cut
# (`cut=1` in the FINAL diagnostics) - not a defect, see §13.10 for the
# full span-identity argument. adv is intentionally unchecked - q.json's
# Hit_advantage for Throw is "D" (knockdown) and the observed +101 is the
# same large-number KD convention seen on CnDB/command-throw HIT
# outcomes. kd: 1 added 2026-07-07 (Phase 4 item 3 diagnosis) - a normal
# throw's last raw[] cell has the defender in r1=3 (grappled), the same
# family the pre-existing throw test already checks, so this entry
# already emits kd=1 today, independent of the strike-KD fix landing in
# Step 3 of that plan.
- label: q-throw-hit
  setup: { dist: 24, dummy: none }
  input: "press LP+LK; wait 60"
  qjson: { name: "Throw" }
  outcome: HIT
  expect: { S: from-qjson, A: from-qjson, R: 34, kd: 1 }

# Neutral jump: far enough from the dummy that no incidental contact can
# happen (see next paragraph) - a jump alone should never finalize any
# move. NOTE (aside finding, out of scope to chase further): at CLOSE range
# (tried 20/24/28/56), a bare `press UP` - and even `press LP+LK` at those
# same distances - incidentally finalizes as outcome=HIT S=2 A=1 R=34
# adv=+101 (identical numbers regardless of which input caused it), while
# idling with no input at all at the same close range finalizes nothing.
# This looks like a proximity-triggered false positive in the overlay's
# partner-r1-transition throw detection (synthesis section 13.8's
# documented "atk=1 P2-dummy FINALs" spurious-MOVE_START item is the same
# family of issue, though not an exact match), not anything specific to
# jumping. Not built out into its own corpus entry - outside this item's
# scope - but worth flagging for whoever picks up that open item.
- label: q-jump-none
  setup: { dist: 250, dummy: none }
  input: "press UP"
  outcome: NONE
