# bleeding into the next entry's window on the first attempt) - each entry
# below adds an explicit trailing `wait 150` to its own input to guarantee
# settle time before the next G/P/L reset. Also note CnDB's actual grab
# reach is much longer than q.json's Throw_range column suggests: dist=70
# and dist=100 both still connect; dist=150 is required for a genuine whiff.
# kd: 1 added 2026-07-07 (Phase 4 item 3 tooling step) - CnDB is the
# throw-KD path (§13.6), already emits kd=1 today.
# R+1 FIXED 2026-07-07 (Phase 4 items 4+5, shipped on frame-data-on-mister):
# the partner-release window (§13.6.1) was always the right size
# (raw_len == arcade S+A+R exactly, 56/59/62) - the catch cell collapses
# mid-tick and the lost declared active tick was double-attributed
# (recovery_pf counted it as recovery while displayed A already counted it
# as active). fd_finalize() now re-derives R from the engine credit
# (meter_len - startup_pf - effective_a) on this path only, gated by the
# explicit `ended_by_partner_release` flag set at the §13.6.1 tick-side
# branch (frame_data_overlay.c). The three HIT entries below now assert
# their real R (42/44/46) and the kd:1 assertion is run-failing.
- label: q-cndb-lk-hit
