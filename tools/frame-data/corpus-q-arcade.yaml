# Stage 3: Q specials (plan section 1.8 item 3).
#
# Dashing Head Attack: q.json lists two variants per strength (fast vs.
# long-charge/full-charge). Only the FAST variant is reachable from this
# harness: charge-back durations from 45 up to 400 frames (~6.6s, tried
# 45/60/90/120/150/200/250/300/400) all produced the identical fast-variant
# numbers (S=13/15/19) - a double-tap-forward variant was also tried and
# produced no special at all (fell back to a plain far normal). The
# long-charge variant's real input recipe was not identified; documenting
# the gap rather than guessing (plan section 1.8/1.10 explicitly allows
# this). Only the fast variant is covered below.
#
# ORDERING NOTE (found while authoring this section): the entry immediately
# after a dash special that actually CONNECTS (Fierce Head / RH Leg below -
# they travel far enough to hit at every teleport distance this harness
# allows) gets a corrupted P1 teleport - atk_x lands wherever P1's dash
# carried it rather than the requested position, breaking any WHIFF/range
# check that immediately follows (P1 recovers to teleporting correctly again
# from the *next* entry onward). Reproduced consistently; not chased into
# the engine (out of scope here). Worked around by ordering every
# distance-sensitive WHIFF entry in this section *before* the two
# always-connecting HIT entries (Fierce Head, RH Leg).
- label: q-dha-jab-whiff
  setup: { dist: 200, dummy: none }
  input: "motion charge-back 45 then-forward LP"
  qjson: { name: "Dashing Head Attack (Jab)", index: 0 }
  outcome: WHIFF
  # q.json's fast-Jab entry (index 0) has an empty Recovery field - explicit
  # int, not from-qjson (from-qjson would fail to parse "").
  expect: { S: from-qjson, A: from-qjson, R: 16 }

- label: q-dha-strong-whiff
  setup: { dist: 200, dummy: none }
  input: "motion charge-back 45 then-forward MP"
  qjson: { name: "Dashing Head Attack (Strong)", index: 0 }
  outcome: WHIFF
  expect: { S: from-qjson, A: from-qjson, R: from-qjson }

- label: q-dla-short-whiff
