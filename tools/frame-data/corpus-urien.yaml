# NAMING NOTE (runbook Phase 1 caution re: throw-family naming varying per
# character): urien.json's throw-family rows are "Neutral Throw" and a bare
# "Throw" - the SAME two-row shape as dudley.json/yun.json. Both rows share
# identical Startup=2/Hit=1/Recovery=21/Throw_range=26 (Block_advantage=0,
# Hit_advantage="D" for both) - verified against the fetched oracle, not
# assumed. "Neutral Throw" is used below, per that precedent.
#
# NO "Far X" ROWS: like dudley.json/makoto.json, urien.json has exactly one
# row per standing-normal button (Jab/Strong/Fierce/Short/Forward/
# Roundhouse) - no separate close/far split. Verified live: dist=250 throws
# the SAME close-range animation for every button and simply fails to
# connect (WHIFF, not a distinct far animation).
#
# ALL SIX crouching normals exist (Jab/Strong/Fierce/Short/Forward/
# Roundhouse) - unlike Dudley/Ryu, urien.json has a complete crouching set.
# Crouching Fierce AND Crouching Roundhouse are BOTH "D"-annotated
# (Hit_advantage="D") - the same two-D-row shape as Dudley (Crouching
# Forward + Crouching Roundhouse); both are HIT-tested for kd below.
#
# THREE of SIX Towards+X command normals exist (Strong/Fierce/Forward) - no
# Towards+Jab/Short/Roundhouse rows. All three are audited below with their
# own WHIFF row per Phase 4; none is "D"-annotated (Hit_advantage is numeric
# for all three), so no separate command-normal HIT entry is authored,
# matching the Dudley/Makoto precedent (HIT is only added for a "D"-marked
# command normal).
#
# urien.json's Startup/Hit/Recovery/*_advantage fields are JSON strings
# (e.g. "Startup": "4") - resolve_from_qjson's `int(raw)` cast
# (compile_corpus.py:432-448) handles this transparently; only genuinely
# non-numeric fields ("-", "D") need an explicit literal or an outright
# skip.
#
# SCOPE (user-directed 2026-07-08, cast rollout): normals ladder (six-button
# close BLOCK/HIT + WHIFF sample + crouching BLOCK for all six + HIT for the
# two "D"-marked crouching normals + all three Towards+X command normals
# each with BLOCK+WHIFF) + UOH + Throw + negative control + ground specials
