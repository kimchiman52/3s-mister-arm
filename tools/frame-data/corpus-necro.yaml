#
# FINDING 3 (STACKED ON TOP OF FINDING 2, defender-stance-conditional):
# unlike every other divergence in this corpus, Flying Viper's OWN BLOCK
# outcome differs by DEFENDER STANCE - dummy:stand BLOCK measures R=19/
# adv=-3 (Finding 2's own contact-surplus number), but a dummy:crouch probe
