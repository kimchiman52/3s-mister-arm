# TWO OVERHEAD-LABEL CONTRADICTIONS (task-relevant verify-vs-assumption
# findings, same posture as corpus-elena.yaml's Mallet Smash finding):
# necro.json's Parry.Low=False on "Back + Forward" (Parry High=True/Low=
# False - the oracle's own overhead-attack shape, "must block standing")
# and on Flying Viper (same Parry shape) would suggest both should whiff or
# read differently against a crouching guard. Empirically:
#   - Back + Forward: a dummy:crouch probe at dist:close measures
#     BYTE-IDENTICAL BLOCK numbers to the dummy:stand probe (S=5/A=1/R=10/
#     adv=+3, both matching necro.json's row exactly) - Necro's crouching
#     guard blocks this move exactly like standing guard, contradicting the
#     oracle's overhead-implied shape. NOT asserted as an engine bug here -
#     a documented empirical finding only (trace fact, no mechanism
#     claimed), same posture as the Elena precedent.
#   - Flying Viper: see the FLYING VIPER GUARD-STANCE R DIVERGENCE section
