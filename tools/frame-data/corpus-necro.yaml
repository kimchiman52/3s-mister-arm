# and dummy:none HIT (R=19 vs arcade Recovery=17, a uniform +2), while WHIFF
# is fully clean at R=17 exact - the calibration surface holds and only the
# two contact outcomes diverge. S/A are exact on every leg (S=26, A=5).
# Trace: BLOCK cut=0/dwellbrk=0/anchor_a=-1 (T=46, S+A+R=50, a 4-frame gap);
# HIT byte-identical trace shape (T=46, cut=0/anchor_a=-1). This resembles
