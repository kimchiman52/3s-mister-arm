# was NOT the requested one - it clustered at 39, 42, 42, 44, 44
# respectively (P1 and P2 symmetrically pushed apart from the requested
# teleport, by an amount that SHRINKS as the requested gap grows: -15/+15
# at dist:9, -8/+8 at dist:26) - i.e. the harness's `P` teleport converges
# toward a ~39-44px floor separation regardless of how tight a gap is
# requested, well outside necro.json's own Throw_range=26. Control test: a
# plain `press DOWN+LP` (Crouching Jab, NOT a grab) requested at dist:9 shows
# the IDENTICAL floor (MOVE_START measures dist=39, not 9) while still
# measuring a fully clean, arcade-exact BLOCK (S=6/A=1/R=4/adv=+5) - proving
