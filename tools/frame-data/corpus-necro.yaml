# stance; not item 4 in isolation - item 4 has no stance-conditional
# clause). TRACE OBSERVATION ONLY, no mechanism claimed beyond what's
# stated: flagged to orchestrator/user for follow-up classification,
# UNCLASSIFIED (flagged 2026-07-08).
#
