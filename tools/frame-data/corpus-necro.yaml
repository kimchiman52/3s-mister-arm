#     at ruling out Snake Fang candidates landed Raging Cobra's numbers by
#     coincidence, then independently re-confirmed with an explicit hcb+K
#     probe under the Raging Cobra qjson name.
#   - Flying Viper (Jab): task's own "qcf+P" guess was WRONG - qcf+P instead
#     lands the plain "Jab" normal (S=5/A=1/R=8). qcb+P is the real motion:
#     S=26/A=5/R=17 exact match to necro.json's row on WHIFF. hcb+P ALSO
