# keyed off the DEFENDER'S STANCE rather than the HIT-vs-BLOCK outcome
# (unlike every Class-1 hit-branch-chain member, which keys off outcome,
# not stance). Does not fit any existing Phase-6 bucket (not #17 - A is
# exact everywhere; not Class 1/2/3 of §13.10 - those are HIT-R families
