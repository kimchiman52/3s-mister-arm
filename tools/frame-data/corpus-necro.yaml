# side effect (Crouching Jab's own large reach simply absorbs the 39px gap
# without changing its outcome, unlike Throw whose real capture range is
# narrower than the floor). This floor is NOT documented anywhere in
# compile_corpus.py's own CAVEAT comment (which only documents a MAXIMUM
# clamp around dist=320-332 for over-large requests, `compile_corpus.py:84-91`)
# - it is a previously-undiscovered MINIMUM, found here because Necro's own
# Throw_range (26px) is the first oracle value in this repo's cast-rollout
# session tight enough to fall entirely inside it. Whether this floor is
# Necro-specific (a wider collision box) or applies to every character
# (in which case some already-shipped very-tight-Throw_range corpora
# elsewhere in this repo may warrant a second look) was NOT tested this
# session (out of budget - would require probing other characters). Per
