#   2. Three sequential `press LP` commands (~9 frames total, the Chun-Li
#      Hyakuretsu precedent's own first attempt) -> plain Jab, identical
#      numbers.
#   3. A tighter five-tap `hold LP 1; wait 1` x5 chain (~10 frames total)
