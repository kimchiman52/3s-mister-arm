#      (S=5/A=1/R=8) - the chain fires multiple separate normals rather
#      than composing into a special.
#   6. A simultaneous `press LP+MP+HP` three-punch chord -> plain "Fierce"
#      (S=15/A=1/R=28, adv=-11 exactly matching necro.json's Fierce row's
#      own Hit_advantage=-11 on a HIT-outcome probe) - a simultaneous
#      multi-punch chord resolves to the single highest-priority button in
#      this build, not a special-move dispatch.
#   7. A tight three-button alternating chain with 1-frame holds and no
#      explicit releases (`hold LP 1; hold MP 1; hold HP 1;` x2 + wait) ->
#      plain Jab again (only the first button's press registers as a true
#      edge without an intervening release).
# Every attempt read back as an ordinary normal, never as Electric Shock.
# This looks like the same same-button/same-family rapid-re-input buffer or
# target-combo timing window the Hyakuretsu precedent describes ("a
# same-button re-input buffer/target-combo timing window distinct from
# anything this repo's existing primitives were built to express") -
# properly characterizing it (binary-searching the actual input-buffer
# window in cmd_data.c or equivalent, or determining whether it is in fact a
# true "mash" count-based special rather than a hold/charge one) is out of
# this session's one-probe budget. Documented as OUT OF SCOPE / wants-
# follow-up, no entries below for it, no oracle edit, no compiler change.
