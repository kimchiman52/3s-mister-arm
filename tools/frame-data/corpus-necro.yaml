#
# FINDING 1: DISTANCE-REACHABILITY GAP (structural, not a divergence).
# dist:close (56px) WHIFFS against both a dummy:stand AND a dummy:none
# target (S=26/A=5/R=17, byte-identical to the dist:250 WHIFF baseline) -
