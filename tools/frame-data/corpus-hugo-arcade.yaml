# --- Crouching normals, BLOCK ----------------------------------------------
# ARCADE DEVIATIONS (task #136), 2 of them, neither touching an `expect:`.
#
# 1. `dummy: crouch` on h-crshort-block and h-crforward-block, where
#    corpus-hugo.yaml says `dummy: stand`. Both are LOWS, and
#    defense_ground_cps3() requires the crouch bit to be held to guard a low
#    (`case 8: if (!(ds->cp->sw_lvbt & 2)) return 2;`, hitcheck.c:1320-1321).
#    defense_ground_ps2()'s same case has an `&& ags == 0` escape
#    (hitcheck.c:1508) that lets a STANDING training ALL-GUARD dummy block a
#    low, which is why the PS2 twin never had to say `crouch`. Measured
#    verbatim-with-`stand` under arcade: h-crshort-block HIT (adv +2, i.e. the
#    hit reading of the same numbers) and h-crforward-block HIT adv=+38 kd=1.
#    h-crfierce-block is NOT a low and needs no change -- it passes verbatim.
#
# 2. `wait 20;` prepended to h-crshort-block's input. Forcing the dummy to
#    crouch drives a fresh DOWN edge on the frame the `G` directive runs, which
#    opens a low-PARRY window; Crouching Short's 3-frame startup lands inside
#    it and the entry reads outcome=PARRY adv=-11 instead of BLOCK. This is
#    balance-INDEPENDENT -- the same file under --test-balance ps2 reads PARRY
#    too -- and h-crforward-block (S=8) is already outside the window. Waiting
#    20 frames closes it; with the wait, both engines read the PS2 golden's
#    BLOCK numbers exactly.
#
# corpus-hugo.yaml's own note on this block: all three match arcade exactly -
# no divergence found among Hugo's tested crouching normals (unlike Ryu, where
# cr.MK/cr.HK carried A-undercount).

- label: h-crshort-block
  setup: { dist: close, dummy: crouch }
  input: "wait 20; press DOWN+LK"
  qjson: { name: "Crouching Short" }
  outcome: BLOCK
  expect: { S: from-qjson, A: from-qjson, R: from-qjson, adv: from-qjson }

- label: h-crforward-block
  setup: { dist: close, dummy: crouch }
  input: "press DOWN+MK"
  qjson: { name: "Crouching Forward" }
  outcome: BLOCK
  expect: { S: from-qjson, A: from-qjson, R: from-qjson, adv: from-qjson }

- label: h-crfierce-block
  setup: { dist: close, dummy: stand }
  input: "press DOWN+HP"
  qjson: { name: "Crouching Fierce" }
  outcome: BLOCK
  expect: { S: from-qjson, A: from-qjson, R: from-qjson, adv: from-qjson }

