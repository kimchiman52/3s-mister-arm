  qjson: { name: "Shootdown Backbreaker (RH)" }
  outcome: WHIFF
  expect: { S: from-qjson, A: from-qjson, R: from-qjson }

# --- Moonsault Press (360 + P, command grab) --------------------------------
# Motion: cardinal-4 rotation + LP/MP/HP (see file header 360 verdict - no
# compiler change). hugo.json lists identical Startup=2/Hit=2/Recovery=36
# for all three strengths; measured S/A match exactly for all three
# (A=2 - contact IS registered, unlike Ryu's hadouken which has no player-
# side attack signal at all; this is a real melee grab, not a projectile,
# so none of the Phase 6A arcade-split machinery is involved: proj=0 on
# every FINAL line below). Unblockable (hugo.json Block_advantage="-";
# verified live: connects as HIT even with dummy:stand, i.e. a standing
# "guard" input does not stop it - the throw-bypasses-block mechanism
# already established for Q's CnDB/normal Throw). kd:1 per the CnDB
# precedent (Hit_advantage="-" -> explicit kd, same as corpus-q.yaml's
# q-cndb-*-hit / corpus-ryu.yaml's ryu-throw-hit).
#
# R diverges on HIT (measured 67 vs arcade 36) but is EXACT on WHIFF
# (h-moonsault-lp-whiff below: R=36) - the §13.10 HIT-R display
# convention (docs/frame-data-synthesis.md, Class 3 connected grab):
# arcade R is the whiff-path figure (captured exactly below); on HIT the
# grab connects and the overlay measures the real post-capture throw
# sequence instead, bounded here by the §13.6.1 partner-release path
# AND raw[] saturation at the FD_METER_LEN=72 cap (`frame_data_overlay.c:
# 42`) - the real capture-to-release span (102 wall ticks) exceeds the
# 72-cell buffer, so R saturates at `(FD_METER_LEN-1) - S - A = 71-2-2 =
# 67` for all three strengths (identical Startup/Hit=2/2 in hugo.json).
# This R expect is therefore a DERIVED value, not an independent
# constant: it moves in lockstep with FD_METER_LEN if that constant ever
# changes, and must be re-derived from the formula above, not
# re-measured from scratch.

- label: h-moonsault-lp-hit
  setup: { dist: close, dummy: none }
  input: "hold RIGHT 2; hold DOWN 2; hold LEFT 2; hold UP 2; hold RIGHT+LP 2; wait 1"
  qjson: { name: "Moonsault Press (Jab)" }
  outcome: HIT
  # BUFFER-1 (2026-07-13): the FD_CAPTURE_LEN 72->256 raise un-caps this
  # partner-release grab's raw[] capture — the `(FD_METER_LEN-1)-S-A`
  # derived-convention formula above (§13.10, "Raising FD_METER_LEN to
  # un-saturate the Hugo grabs was considered and rejected... it would
  # only trade one convention's R for another with no arcade oracle
  # either way") is now STALE: this fix trades exactly that rejected
  # trade, as a side effect of the M1 raise. Post-fix measured R=99 (was
  # 67); the three Moonsault buttons no longer share one uniform value
  # (100/98 on MP/HP below) since each button's true post-release span
  # differs slightly. R DE-ASSERTED (not re-derived to a new formula this
  # cycle — no arcade oracle exists for this post-contact span either
  # way, same as before); flagged prominently for orchestrator/user
  # review — this REOPENS the §13.10 "No FD_METER_LEN resize" decision,
  # not merely a re-measurement.
  expect: { S: from-qjson, A: from-qjson, kd: 1 }

- label: h-moonsault-mp-hit
  setup: { dist: close, dummy: none }
  input: "hold RIGHT 2; hold DOWN 2; hold LEFT 2; hold UP 2; hold RIGHT+MP 2; wait 1"
  qjson: { name: "Moonsault Press (Strong)" }
  outcome: HIT
  # BUFFER-1 (2026-07-13): same de-assert as h-moonsault-lp-hit above.
  # Post-fix measured R=100 (was 67).
  expect: { S: from-qjson, A: from-qjson, kd: 1 }

- label: h-moonsault-hp-hit
  setup: { dist: close, dummy: none }
  input: "hold RIGHT 2; hold DOWN 2; hold LEFT 2; hold UP 2; hold RIGHT+HP 2; wait 1"
  qjson: { name: "Moonsault Press (Fierce)" }
  outcome: HIT
  # BUFFER-1 (2026-07-13): same de-assert as h-moonsault-lp-hit above.
  # Post-fix measured R=98 (was 67).
  expect: { S: from-qjson, A: from-qjson, kd: 1 }

- label: h-moonsault-lp-whiff
  setup: { dist: 200, dummy: none }
  input: "hold RIGHT 2; hold DOWN 2; hold LEFT 2; hold UP 2; hold RIGHT+LP 2; wait 1"
  qjson: { name: "Moonsault Press (Jab)" }
  outcome: WHIFF
  expect: { S: from-qjson, A: from-qjson, R: from-qjson }

# --- Meat Squasher (360 + K, command grab, RUNNING) -------------------------
# Motion: cardinal-4 rotation + LK/MK/HK (see file header 360 verdict).
# hugo.json's Startup is a RANGE STRING ("21 ~ 24" / "31 ~ 52" / "44 ~ 67")
# for all three strengths - Meat Squasher visibly runs Hugo forward as part
# of its startup (matches its pl06_exatt_table dispatch name,
# Att_PL06_HASHIRI_NAGE, literally "running throw" - src/sf33rd/Source/Game/
# engine/plpat06.c:189-206), so Startup genuinely varies with how far Hugo
# has to travel to reach the opponent. Measured LIVE at dist:close (56):
# S=21/31/44 - exactly the FLOOR of each range. Measured at dist=200:
# Short's S rises to 24 (the CEILING of its range, and it WHIFFS there -
# see below) while Forward/RH still connect at dist=200 (S=38 for Forward,
# still mid-range; RH stays at 44, its own floor, reach not yet exhausted
# at this distance) - confirms the range is a real distance-dependent
# quantity, not corpus noise. Per the plan's authorization ("explicit S:
# observed value inside the arcade range, comment the range"), S below is
# always an explicit literal (from-qjson would not compile against a
# non-numeric field), not from-qjson.
#
# A matches hugo.json exactly (2) for all three strengths at both close and
# far range. R diverges on HIT the same §13.10 HIT-R display convention way
# as Moonsault Press above (Class 3 connected grab, measured 48/38/25 vs
# arcade 30/33/36 for Short/Forward/RH) but is EXACT on WHIFF
# (h-meatsquasher-short-whiff: R=30, matching arcade exactly at S=24).
# Unblockable/kd:1, same CnDB-precedent reasoning as Moonsault Press. The
# divergence isn't uniformly larger or smaller than arcade - this is now
# resolved (§13.10): all three HIT rows below saturate at the
# FD_METER_LEN=72 cap the same way Moonsault does, `R = (FD_METER_LEN-1) -
# S - A = 71 - S - 2` (zero residual: 67=71-2-2 covers Moonsault above;
# 48=71-21-2, 38=71-31-2, 25=71-44-2 cover Short/Forward/RH below) - RH's
# R (25) sits BELOW arcade specifically because its large S(=44) eats most
# of the fixed 71-cell budget, while the smaller-S grabs leave more of the
# budget for R. Each R expect below is therefore a DERIVED value tied to
# FD_METER_LEN (`frame_data_overlay.c:42`), not an independent constant -
# it moves in lockstep if that constant ever changes.

# h-meatsquasher-short-whiff is authored FIRST in this section (immediately
# after h-moonsault-lp-whiff above, another WHIFF) rather than after a HIT
# entry - discovered empirically this session: teleporting straight to
# dist=200 right after a HIT grab (defender still mid-knockdown-recovery,
# kd=1, adv=+133 means ~263 raw ticks of residual recovery from move-start)
# stomps the P-directive's position write before it can stick (observed:
# the compiled `P 424 624` line executed but MOVE_START still read dist=52,
# identical to the prior HIT entry's position - the teleport silently
# no-op'd), even with a generous trailing wait. A WHIFF predecessor leaves
# no knockdown residue at all, so the teleport lands cleanly - same fix
# shape as corpus-q.yaml's CnDB section trailing-wait note, but here the
# fix is predecessor-outcome ordering, not just a longer wait.

- label: h-meatsquasher-short-whiff
  setup: { dist: 200, dummy: none }
  input: "hold RIGHT 2; hold DOWN 2; hold LEFT 2; hold UP 2; hold RIGHT+LK 2; wait 100"
  qjson: { name: "Meat Squasher (Short)" }
  outcome: WHIFF
  expect: { S: 24, A: from-qjson, R: from-qjson }

# R=48 is meter-cap-bounded: (FD_METER_LEN-1) - S - A = 71-21-2 = 48
# (FD_METER_LEN=72, frame_data_overlay.c:42) - see the section header
# comment above for the full §13.10 Class 3 argument; this expect moves
# in lockstep with FD_METER_LEN if that constant ever changes.
- label: h-meatsquasher-short-hit
  setup: { dist: close, dummy: none }
  input: "hold RIGHT 2; hold DOWN 2; hold LEFT 2; hold UP 2; hold RIGHT+LK 2; wait 100"
  qjson: { name: "Meat Squasher (Short)" }
  outcome: HIT
  # BUFFER-1 (2026-07-13): same §13.10-reopening de-assert as the
