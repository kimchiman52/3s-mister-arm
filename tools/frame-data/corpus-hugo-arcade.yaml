# Hugo under ARCADE (CPS3) balance -- task #136, generalisation probe.
#
# WHY THIS CORPUS EXISTS
# ----------------------
# Task #108 shipped arcade coverage for exactly two corpora (Q and Yun SA3) and
# was explicit that "the other 18 characters port cheaply" was an ARGUMENT, not
# a measurement: it rested on 49 of Q's 51 non-BLOCK entries passing unchanged.
# This corpus is one of three bounded tests of that generalisation, picked for
# how far its mechanics sit from Q's and Yun's: Hugo is the heaviest body in
# the cast and the only character whose corpus is dominated by command grabs
# (Shootdown Backbreaker, Moonsault Press, Meat Squasher), i.e. the CnDB
# machinery rather than the normal hit/block path.
#
# RESULT
# ------
# All 30 entries of corpus-hugo.yaml pass under arcade, and the parsed table is
# byte-identical to tools/frame-data/golden/hugo.tsv (the PS2 measurement) --
# same outcome, same S/A/R/adv/kd on every label, command grabs included.
# Cross-checked by running THIS file under --test-balance ps2 as well: also
# 30/30, also identical. Measured 2026-08-30.
#
# PROVENANCE
# ----------
# Every entry below, and every per-entry comment, is copied VERBATIM from
# corpus-hugo.yaml, so the authoring rationale that justifies each number is
# the same text that justifies it on the PS2 side. Two entries carry a marked
# deviation, neither of which touches an `expect:` field; see the inline note
# above the crouching-normals block. corpus-hugo.yaml's FILE-level header (the
# Step 6a motion-decoding discovery, the hugo.json md5 pin, the harness
# limitations it hits) is not duplicated here -- read it there.
character: hugo
oracle: hugo.json
balance: arcade
inter_entry_wait: 200
entries:

# --- Normals baseline, BLOCK (dummy: stand, dist: close) --------------------
# Six-button close-range sample, same discipline as corpus-ryu.yaml's
# A-undercount-on-contact audit (docs/frame-data-synthesis.md issue #17,
# the engine-wide same-tick contact-advance finding - see corpus-ryu.yaml's
# file header for the full root-cause). Two shapes of divergence show up
# for Hugo: the familiar A-undercount (Short/Forward), and the SAME
# issue-#17 mechanism manifesting on R instead of A on Roundhouse (R reads
# +2 vs arcade on BOTH BLOCK and HIT while WHIFF is exact). Classified
# 2026-07-07 (plan Step 4): the contact tick's cg_extdat=0x80 advance
# collapses 2 declared-active anim ticks, and because st.RH's move end is
# landing-clocked (jumping_union_process, pls01.c:767 - outcome-
# independent, fires at move tick 34 on all three outcomes) rather than
# chain-clocked, the freed ticks re-materialize as 2 extra no-hitbox
# pre-landing frames counted as R, while A survives via entry-credit +
# distinct transit jatix (no 13.7.4 revoke). Full tick table: synthesis
# item 17, Hugo Roundhouse addendum.

# UPDATE (2026-07-10, CONV-2): the user decision has been taken -
# h-roundhouse-block/-hit convert to a plain PASS under §13.13 family
# F5, asserting the engine-truth R=30 (the freed declared-active ticks
# tally as RECOVERY on the played chain). 0 of 2 Roundhouse entries
# remain xfail.

- label: h-jab-block
  setup: { dist: close, dummy: stand }
  input: "press LP"
  qjson: { name: "Jab" }
  outcome: BLOCK
  expect: { S: from-qjson, A: from-qjson, R: from-qjson, adv: from-qjson }

- label: h-strong-block
  setup: { dist: close, dummy: stand }
  input: "press MP"
  qjson: { name: "Strong" }
  outcome: BLOCK
  expect: { S: from-qjson, A: from-qjson, R: from-qjson, adv: from-qjson }

