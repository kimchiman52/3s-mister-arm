# already-expressible primitives were tried and abandoned rather than
# escalated to a compile_corpus.py change (per the runbook's "extend
# _motion_steps ONLY IF no expressible sequence lands the move" - this
# isn't even a motion-macro problem, so that escalation path doesn't apply
# here regardless): (1) three sequential `press LK` commands (2-frame hold +
# 1-frame release each, ~9 frames total) and (2) a tighter `hold LK 1; wait
# 1` x3 tap-chain (~6 frames total) both read back as a single plain "Short"
# (S=3 A=1 R=9, chunli.json's Short row, matching chunli-short-block's own
# shape-(a1)-undercounted numbers) - i.e. only the first tap ever registers
# as an attack; the chain-into-Hyakuretsu condition never triggers. This
# looks like a same-button re-input buffer/target-combo timing window
# distinct from anything this repo's existing primitives were built to
# express (unlike a DP-shape hold-chain or an existing motion macro,
# already-available building blocks don't obviously compose into "N
# same-button taps within an unknown short window"), and probing that
# properly (binary-searching the actual input-buffer window in cmd_data.c or
# equivalent) is out of this session's one-probe budget. Documented as
# OUT OF SCOPE / wants-follow-up, no entries below for it, no oracle edit,
# no compiler change.
