  input: "hold RIGHT 2; hold DOWN 2; hold DOWN+RIGHT 2; hold RIGHT+LP+HP 2; wait 1"
  qjson: { name: "Jet Uppercut (EX)" }
  outcome: WHIFF
  # Measured S=3 A=21 R=34 — oracle-exact on all three (dudley.json Jet
