# oracle match for LK on the FIRST attempt of this shape, and MK/HK (same
# recipe, button swapped) matched exactly too
# (`<sp>/sa-hugo/run-probe18/trace.log`), all three PASS on the first
# post-identification try. No compile_corpus.py change — the existing
# `hold` primitive expresses this cleanly, same "no new macro needed"
# verdict as every other Hugo grab family.
#
# WHIFF — all three strengths ship clean, exact oracle matches (S/A/R,
# `<sp>/sa-hugo/run-probe17/trace.log` LK, `run-probe18/trace.log` MK/HK).
#
# BLOCK/HIT — UNREACHABLE against ANY grounded dummy, at ANY distance.
# Per the binding spec's own pre-registered hint ("SA2 Megaton Press is a
# leaping press... anti-air components may whiff a grounded dummy"): this
# session swept dist ∈ {20, 30, 40 (SA1 cross-check only), 45, 50, 80, 120,
# close(56), far(175)} × dummy ∈ {none, stand, crouch} for LK (plus a
# dedicated close-range check for HK) — EVERY combination read outcome=
# WHIFF, byte-identical to the plain-WHIFF baseline numbers (S=2/A=12/R=30
# for LK, S=6/A=20/R=36 for HK) — i.e. the dummy is never actually struck,
# not merely "struck but misclassified." (`<sp>/sa-hugo/run-probe18/
# trace.log` close+stand/none; `run-probe19/trace.log` dist 45/30;
# `run-probe20/trace.log` dist 80/120/far, HK close; `run-probe21/
# trace.log` crouch+close, both HIT and BLOCK outcome declarations.) This
# is consistent with Megaton Press genuinely being an anti-air/leaping
# attack whose landing hitbox does not reach a standing or crouching body
# at ground level — this harness's `setup.dummy` only supports `none`/
# `stand`/`crouch` (`compile_corpus.py`'s `GUARD_MODES`, no scriptable
# "airborne dummy" state exists, and `authoring-policy.md`'s own E-5 census
# confirms the script directive set — W/L/P/G/Q — has no dummy-jump
# primitive either), so testing the one geometry that might actually
# connect (a jumping/airborne opponent) is out of scope for this harness,
# not merely untried. Documented here as a structural WHIFF-only coverage
# gap, not forced and not guessed at.
#
# Admissibility census (mechanical, from FRAME_TRACE columns, this
# session's own isolated probes, inter_entry_wait:500 throughout):
# (1) single-FINAL integrity — exactly one MOVE_START/FINAL pair per
# entry's own window on every probe re-used below. (2) flash-overlap
