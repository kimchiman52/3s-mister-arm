# for this slot specifically. The WINNING candidate
# (`<sp>/sa-hugo/run-probe17/trace.log`, `h-sa2-p17-double-dp-lk`): a
# DOUBLE DP-SHAPE — TWO chained "forward, down, down-forward" passes (the
