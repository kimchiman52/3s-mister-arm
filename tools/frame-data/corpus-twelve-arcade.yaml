  outcome: BLOCK
  expect: {"S": "from-qjson", "A": "from-qjson", "R": "from-qjson", "adv": "from-qjson"}

- label: twelve-ndl-jab-hit
  setup: {"dist": "close", "dummy": "none"}
  input: "motion qcf LP"
  qjson: {"name": "N.D.L. (Jab)"}
  outcome: HIT
  expect: {"S": "from-qjson", "A": "from-qjson", "R": "from-qjson"}

- label: twelve-jump-none
  setup: {"dist": 250, "dummy": "none"}
  input: "press UP"
  outcome: NONE
