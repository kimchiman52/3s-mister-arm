- label: q-hsb-ex-block
  setup: { dist: close, dummy: stand }
  input: "hold RIGHT 2; hold RIGHT+DOWN 2; hold DOWN 2; hold DOWN+LEFT 2; hold LEFT+LP+HP 2; wait 1"
  qjson: { name: "High Speed Barrage (EX)" }
  outcome: BLOCK
  # BUFFER-1 (2026-07-13): R now asserted from-qjson, same basis as WHIFF.
  expect: { S: from-qjson, A: from-qjson, R: from-qjson, adv: from-qjson }

# --- Dashing Head Attack (EX) HIT -------------------------------------------
# S/A oracle-exact; A (3) equals the BLOCK leg's displayed A (3) — juggle
# check (Ruling 2 check 3) PASSES, admissible. R measured 18 vs oracle/
# BLOCK-leg 36 (exactly half) — the §13.10 Class-1 hit-branch shape (a
# genuinely shorter parallel recovery chain plays on HIT than on BLOCK,
# same family as corpus-q.yaml's own base-move HSB/DLA-RH HIT-R entries and
# every other Class-1 conversion in this program) — asserted as the
# convention value, not xfail. Base Dashing Head Attack (Fierce) in
# corpus-q.yaml does NOT show this split (its own HIT matched q.json
# exactly) — EX gaining a hit-branch split its base lacks is the expected
# "test, don't inherit" outcome (wave-5 guidance item 2), not a
# contradiction. adv unasserted (Hit_advantage is "-" in q.json, same as
# every Q move's HIT leg); the measured +106 is the large-number KD
# convention already used throughout corpus-q.yaml (e.g. q-throw-hit,
# q-crhk-hit), covered here by kd:1 (kdr2=18, a genuine buttobi knockdown).
- label: q-dha-ex-hit
  setup: { dist: close, dummy: none }
  input: "hold LEFT 45; hold RIGHT+LP+HP 2; wait 1"
  qjson: { name: "Dashing Head Attack (EX)" }
  outcome: HIT
  expect: { S: from-qjson, A: from-qjson, R: 18, kd: 1 }

