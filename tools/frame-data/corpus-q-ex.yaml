# measured 6 (busyr=36=oracle exactly), OMITTED here (clipped, not
# engine-truth — same disposition as the WHIFF leg). box_a=12, busyr=36,
# box_runs=1 (contrast the WHIFF leg's box_runs=7 — contact-leg box-run
