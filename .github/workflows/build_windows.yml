name: Build (Windows)

on:
    pull_request:
        branches: [ "main" ]
    workflow_dispatch: {}

jobs:
    build:
        runs-on: windows-latest

        defaults:
            run:
                shell: msys2 {0}

        steps:
          - id: msys2
            uses: msys2/setup-msys2@v2
            with:
                update: true
                msystem: MINGW64

          # Git for Windows on this runner defaults core.autocrlf=true, so
          # actions/checkout below would silently rewrite every text file's
          # LF to CRLF as it lands on disk -- including build-deps.sh, whose
          # GekkoNet patches match literal multi-line bash string anchors
          # against the (separately, correctly LF) cloned dependency source.
          # A checked-out build-deps.sh with \r\n line endings turns those
          # bash single-quoted literals into "...\r\n..." internally, which
          # can never match an LF-only file no matter how that file is
          # cloned -- this is why fixing the GekkoNet clone's own line
          # endings alone did not resolve the failure. Disabling autocrlf
          # globally BEFORE checkout, in the same shell git-for-windows
          # itself uses (bash, not the msys2 job default -- a separate git
          # install with its own config), stops the corruption at its
          # source instead of chasing it downstream. `requirements-windows.
          # txt`'s pre-existing `tr -d '\r'` a few lines below is the same
          # symptom, worked around per-file rather than fixed at the root.
          - name: Disable autocrlf before checkout
            shell: bash
            run: git config --global core.autocrlf false

          - name: Checkout repository
            uses: actions/checkout@v4
            with:
                submodules: true

          - name: Install MSYS2 packages
            run: tr -d '\r' < tools/requirements-windows.txt | xargs pacman -S --needed --noconfirm

          - name: Cache dependencies
            uses: actions/cache@v4
            with:
                path: third_party
                key: ${{ runner.os }}-deps-${{ hashFiles('build-deps.sh') }}

          - name: Build dependencies
            run: sh build-deps.sh

          - name: Build for Windows
            run: |
                set -o pipefail

                CC=clang CXX=clang++ cmake -B build \
                    -DCMAKE_BUILD_TYPE=Release \
                    -DMSYS2_LOCATION=${{ steps.msys2.outputs.msys2-location }}

                cmake --build build --parallel 2>&1 | tee build.log

          - name: Stage the distributable build
            if: github.event_name == 'workflow_dispatch'
            run: |
                # Reuses this project's own install() rules (CMakeLists.txt's
                # WIN32 branch), which already stage the game exe, the
                # desktop netplay launcher, SDL3.dll and every other runtime
                # dependency together via RUNTIME_DEPENDENCY_SET -- so this
                # step does not hand-maintain a second list of what ships.
                cmake --install build --config Release --prefix install

          - name: Upload build log
            if: always()
            uses: actions/upload-artifact@v4
            with:
                name: build-log
                path: build.log

          - name: Upload Windows build
            if: github.event_name == 'workflow_dispatch'
            uses: actions/upload-artifact@v4
            with:
                name: 3s-arm-windows
                path: install/bin
